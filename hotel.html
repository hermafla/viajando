<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alojamiento | Valijeando</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#10203a}.wrap{max-width:900px;margin:50px auto;padding:20px}.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 35px #10203a18}h1{margin-top:0}.summary{background:#eef5ff;padding:18px;border-radius:14px;margin:20px 0}.btn{display:inline-block;background:#1677ff;color:white;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:700}.note{font-size:14px;color:#5b6677;margin-top:18px}</style></head><body><div class="wrap"><div class="card"><h1>🏨 Alojamiento</h1><p>Estamos preparando tu búsqueda con los datos que elegiste en Valijeando.</p><div class="summary" id="summary"></div><a class="btn" id="trip" target="_blank" rel="noopener">Ver alojamientos en Trip.com →</a><p class="note">La reserva se completa en Trip.com. Ingresá destino, fechas y viajeros en el buscador oficial de Trip.com. No modificamos enlaces de afiliado para evitar perder la atribución.</p></div></div><script>
const p=new URLSearchParams(location.search),dest=p.get("destino")||"",pais=p.get("pais")||"",ida=p.get("fechaIda")||"",vuelta=p.get("fechaVuelta")||"",viajeros=p.get("viajeros")||"2";
document.getElementById("summary").textContent=[dest+(pais?", "+pais:""),ida&&vuelta?ida+" → "+vuelta:"",viajeros+" viajero(s)"].filter(Boolean).join(" · ");
document.getElementById("trip").href="https://es.trip.com/hotels";
</script></body></html>
