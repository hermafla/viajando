<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <title>Validación USD | Valijeando</title>
  <link rel="icon" type="image/svg+xml" href="/valijeando-favicon.svg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    header{background:#fff;border-bottom:1px solid #eef2f7;padding:0 24px}
header .nav{max-width:1160px;min-height:92px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:30px}
header img{width:180px;max-width:70vw;display:block}
.menu{display:flex;align-items:center;gap:30px;font-size:15px;font-weight:700}
.menu a{color:#111827;text-decoration:none}
.menu a.active{color:#0b74ff}
.menu a.account{border:1px solid #cbd5e1;border-radius:999px;padding:10px 20px}
main{width:min(1160px,calc(100% - 32px));margin:26px auto}
    .notice{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .notice h1{margin:0 0 6px;font-size:22px}
    .notice p{margin:0;line-height:1.5}
    #tpwl-search{margin-bottom:24px}
    #tpwl-tickets{min-height:200px}
    .notice{background:#fff!important;color:#0f172a!important;border:1px solid #edf0f5;border-radius:17px;padding:24px 18px;box-shadow:0 1px 2px rgba(15,23,42,.02),0 8px 28px rgba(15,23,42,.03)}
.notice:before{content:"VUELOS EN VALIJEANDO";display:block;color:#0b74ff;font-size:12px;font-weight:800;letter-spacing:1.6px;margin-bottom:5px}
.notice h1{font-size:27px;letter-spacing:-.4px;margin:0 0 5px}
.notice p{color:#64748b!important;font-size:14px}
    #selected-fare{font-family:Arial,sans-serif}
    #selected-fare-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(3px);z-index:2147483646}
    #selected-fare.is-open{display:block!important;position:fixed!important;left:50%!important;top:50%!important;bottom:auto!important;transform:translate(-50%,-50%)!important;width:min(500px,calc(100vw - 32px))!important;max-width:none!important;border:0!important;border-radius:22px!important;padding:0!important;overflow:hidden!important;box-shadow:0 28px 80px rgba(15,23,42,.35)!important;z-index:2147483647!important;opacity:1!important;visibility:visible!important;filter:none!important}
    .fare-head{padding:22px 24px 18px;background:linear-gradient(135deg,#07558f,#0b6da8);color:#fff}
    .fare-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.78}
    #selected-fare-main{font-size:34px!important;color:#fff!important;margin-top:4px}
    #selected-fare-sub{color:rgba(255,255,255,.88)!important;font-size:14px!important}
    .fare-body{padding:22px 24px 24px}
    #selected-fare-compare{border-top:0!important;margin:0!important;padding:0!important;font-size:15px!important;line-height:1.65!important}
    #selected-fare-continue{background:#f58220!important;border-radius:12px!important;padding:14px 16px!important;font-size:15px!important;box-shadow:0 8px 20px rgba(245,130,32,.24);cursor:pointer!important}.fare-actions{display:grid;gap:10px;margin-top:14px}.fare-add-trip{display:none;width:100%;border:0;border-radius:12px;padding:14px 16px;background:#1677ff;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.fare-add-trip:hover{background:#0b68e8}
    #selected-fare-close{position:absolute!important;right:16px!important;top:14px!important;z-index:10!important;border:0!important;background:rgba(255,255,255,.16)!important;color:#fff!important;width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;padding:0!important;border-radius:50%!important;font-size:20px!important;line-height:38px!important;text-align:center!important;cursor:pointer!important;pointer-events:auto!important}
    #selected-fare-continue{width:100%;border:0;color:#172033;font-weight:800}
    .fare-note{margin-top:12px;padding:0;font-size:13px;line-height:1.45;color:#334155;text-align:center;font-weight:700;background:transparent;border:0;border-radius:0;text-shadow:-1px -1px 0 rgba(255,255,255,.95),1px -1px 0 rgba(255,255,255,.95),-1px 1px 0 rgba(255,255,255,.95),1px 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(255,255,255,.95)}
    @media(max-width:700px){header{padding:0 16px}header .nav{min-height:72px}.logo img{width:165px}.menu a:not(.account){display:none}main{width:calc(100% - 20px);margin-top:18px}.notice h1{font-size:22px}#selected-fare.is-open{width:calc(100vw - 20px)!important;max-height:calc(100vh - 20px)!important;overflow:auto!important}.fare-head{padding:18px 20px 15px}.fare-body{padding:17px 20px 19px}#selected-fare-main{font-size:29px!important}.fare-actions{gap:8px;margin-top:11px}.fare-add-trip,#selected-fare-continue{padding:13px 12px!important}.fare-note{font-size:12px}}
  </style>
  <script>
    // El motor puede reemplazar la URL al cargar. Guardar el regreso antes de iniciarlo.
    (function(){
      const p=new URLSearchParams(location.search),search=p.get('flightSearch')||'',incoming=p.get('returnTrip')||'',key='valijeandoFlightReturn:'+search;
      const navigation=performance.getEntriesByType?.('navigation')[0]?.type||'navigate';
      const saved=(navigation==='reload'||navigation==='back_forward')?sessionStorage.getItem(key)||'':'';
      window.__VALIJEANDO_FLIGHT_CONTEXT={search,returnTrip:incoming||saved};
      if(incoming)sessionStorage.setItem(key,incoming);
      else if(navigation==='navigate')sessionStorage.removeItem(key);
    })();
  </script>
  <script>
window.TPWL_CONFIGURATION = {defaultCurrency: "USD", availableCurrencies: ["USD"], availableMarkets: ["us"]};
(function () {
  var originalFetch = window.fetch;
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : input && input.url || "";
    var isSearch = /\\/(?:whitelabels\\/web\\/flights\\/v1\\/search\\/sign|search\\/wl\\/(?:start|results))/.test(url);
    if (isSearch && init && typeof init.body === "string") {
      try { var body = JSON.parse(init.body); console.info("[Valijeando USD test]", url.split("?")[0], body.market_code || "", body.currency_code || ""); } catch (_) {}
    }
    return originalFetch.apply(this, arguments).then(function(response) {
      if (isSearch) console.info("[Valijeando USD test response]", url.split("?")[0], response.status);
      return response;
    });
  };
})();
</script>
<script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">

      var script = document.createElement("script");

<link rel="stylesheet" href="/site-header.css"><script src="/site-header.js" defer></script><script src="/flight-calendar.js" defer></script></head>
<body>
  <header class="vh-header" data-valijeando-header></header>
  <main>
    <section class="notice">
      <h1>Encontrá tu próximo vuelo</h1>
      <p>Compará opciones disponibles y elegí la que mejor se adapte a tu viaje. La tarifa seleccionada y las condiciones se confirman en el sitio del proveedor.</p>
    </section>
    <div id="tpwl-search"></div>
    <div id="tpwl-tickets"></div>
    <div id="selected-fare-backdrop"></div>
    <section id="selected-fare" style="display:none">
      <button id="selected-fare-close" type="button" aria-label="Cerrar">×</button>
      <div class="fare-head">
        <div class="fare-kicker">ANTES DE CONTINUAR</div>
        <div id="selected-fare-main"></div>
        <div id="selected-fare-sub"></div>
      </div>
      <div class="fare-body">
        <div id="selected-fare-compare" style="display:none"></div>
        <div class="fare-actions"><button id="selected-fare-add-trip" class="fare-add-trip" type="button">Agregar este vuelo a mi viaje →</button><button id="selected-fare-continue" type="button" style="display:none">Continuar con el proveedor →</button></div>
        <div class="fare-note">El precio final y las condiciones se confirman en el sitio del proveedor.</div>
      </div>
    </section>

  </main>
  <script src="/travel-party.js"></script><script src="/flight-fare.js"></script>
  <script>
  (function(){
    const box=document.getElementById('selected-fare'),backdrop=document.getElementById('selected-fare-backdrop'),main=document.getElementById('selected-fare-main'),sub=document.getElementById('selected-fare-sub'),close=document.getElementById('selected-fare-close'),proceed=document.getElementById('selected-fare-continue'),add=document.getElementById('selected-fare-add-trip');
    const returnValue=window.__VALIJEANDO_FLIGHT_CONTEXT?.returnTrip||'',returnTrip=ValijeandoParty.internalUrl(returnValue,'/viaje.html')||ValijeandoParty.internalUrl(returnValue,'/revisar-viaje.html');
    let fare=null,returnFocus=null;
    document.body.appendChild(backdrop);document.body.appendChild(box);
    box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Tarifa del vuelo seleccionado');
    function closeModal(){box.classList.remove('is-open');box.style.display='none';backdrop.style.display='none';returnFocus?.focus()}
    close.onclick=closeModal;backdrop.onclick=closeModal;
    document.addEventListener('keydown',e=>{
      if(!box.classList.contains('is-open'))return;
      if(e.key==='Escape')closeModal();
      if(e.key==='Tab'){const f=[...box.querySelectorAll('button')].filter(x=>x.style.display!=='none'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    });
    proceed.onclick=()=>{if(fare)window.open(fare.redirect_url,'_blank','noopener')};
    add.onclick=()=>{if(!fare||!returnTrip||fare.currency!=='USD'||new URLSearchParams(location.search).get('flightSearch')!==window.__VALIJEANDO_FLIGHT_CONTEXT.search)return;const target=new URL(returnTrip,location.origin);target.searchParams.set('vuelo',String(fare.value));target.searchParams.set('vueloReal','1');target.searchParams.set('vueloSeleccionado','1');target.searchParams.set('vueloProveedor',fare.provider);target.searchParams.set('vueloRedirect',fare.redirect_url);location.href=target.pathname+target.search};
    document.addEventListener('click',e=>{
      const anchor=e.composedPath().find(n=>n?.tagName==='A'&&String(n.href).includes('tpscr.com/wl/redirect'));
      const selected=ValijeandoFare.selectedOffer(anchor);
      // Si cambió la estructura del motor, el proveedor sigue abriéndose sin inventar un importe.
      if(!selected)return;
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
      fare=selected;returnFocus=anchor;
      main.textContent=fare.currency+' '+fare.value.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
      sub.textContent='Oferta seleccionada · '+fare.provider;
      box.style.display='block';box.classList.add('is-open');backdrop.style.display='block';
      const sameSearch=new URLSearchParams(location.search).get('flightSearch')===window.__VALIJEANDO_FLIGHT_CONTEXT.search;
      proceed.style.display=returnTrip&&sameSearch&&fare.currency==='USD'?'none':'block';
      proceed.textContent='Continuar con el proveedor →';
      add.style.display=returnTrip&&sameSearch&&fare.currency==='USD'?'block':'none';
      close.focus();
    },true);
  })();
  </script>
</body></html>
