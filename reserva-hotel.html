<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizá tu reserva | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}header{background:#07558f;padding:16px 24px}header img{width:205px}.wrap{width:min(1160px,94%);margin:24px auto 50px}.sandbox[hidden]{display:none}.sandbox{display:inline-block;background:#fff3cd;color:#725500;padding:7px 10px;border-radius:8px;font-weight:800;font-size:12px}h1{font-size:28px;margin:18px 0 4px}.steps{color:#64748b;font-size:13px;margin-bottom:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:22px;align-items:start}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;box-shadow:0 5px 18px #00000008}.formTitle{margin:0 0 4px;font-size:21px}.intro{margin:0 0 16px;color:#64748b;font-size:14px}.secure{display:flex;gap:8px;align-items:center;background:#eef8f2;color:#176b37;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px}label{font-weight:800;display:block;margin:14px 0 6px;font-size:14px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}input:focus{outline:2px solid #b9ddf5;border-color:#07558f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:10px;background:#f58220;color:#fff;font-weight:900;padding:14px;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.muted{color:#64748b}.summary{position:sticky;top:18px;padding:0;overflow:hidden}.summaryHead{padding:20px 20px 15px;border-bottom:1px solid #e5e7eb}.summaryHead h2{margin:0;font-size:21px}.summarySection{padding:16px 20px;border-bottom:1px solid #e5e7eb}.summarySection:last-child{border-bottom:0}.summaryLabel{font-size:12px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}.summaryHotel{font-size:18px;font-weight:900;line-height:1.25}.tripGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.tripBox{background:#f7fafc;border-radius:9px;padding:10px}.tripBox span{display:block;color:#64748b;font-size:12px;margin-bottom:3px}.tripBox b{font-size:14px}.stayLine{font-size:13px;color:#64748b;margin-top:9px}.roomName{font-size:15px;font-weight:900;line-height:1.25}.board{font-size:13px;color:#64748b;margin-top:5px}.cancelSummary{font-size:13px;margin-top:9px;line-height:1.35}.cancelSummary.good{color:#08752a}.cancelSummary.bad{color:#b91c1c}.detailRow{display:flex;justify-content:space-between;gap:18px;padding:6px 0;font-size:13px}.detailRow span{color:#64748b}.detailRow b{text-align:right}.totalRow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:9px}.totalLabel{font-weight:900;font-size:14px}.price{font-size:30px;font-weight:900;line-height:1}.paySplit{font-size:12px;line-height:1.45;color:#475569;margin:10px 0 0}.billing{background:#f7fafc;border-radius:9px;padding:11px 12px;font-size:12px;line-height:1.4;color:#475569}.billing b{display:block;color:#172033;font-size:13px;margin-bottom:4px}.ok{background:#f7fffa;border:1px solid #b9e7c8;padding:24px;border-radius:14px;margin-top:18px}.ok h2{margin:0 0 8px;font-size:24px;color:#08752a}.okLead{margin:0 0 18px;color:#475569;line-height:1.45}.confirmGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.confirmBox{background:#fff;border:1px solid #dbe7df;border-radius:10px;padding:12px}.confirmBox span{display:block;font-size:11px;color:#64748b;text-transform:uppercase;font-weight:800;margin-bottom:4px}.confirmBox b{font-size:14px}.confirmCode{background:#fff;border:1px dashed #9bcaaa;border-radius:10px;padding:13px;margin:14px 0}.confirmCode span{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.confirmCode b{font-size:18px;letter-spacing:.02em}.confirmNote{font-size:13px;color:#475569;line-height:1.45}.confirmActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.confirmActions a{display:inline-block;text-decoration:none;font-weight:800;border-radius:9px;padding:11px 15px}.homeBtn{background:#07558f;color:#fff}.accountBtn{background:#fff;color:#07558f;border:1px solid #07558f}.err{background:#fff0f0;color:#9b1c1c;padding:14px;border-radius:10px;margin-top:14px}@media(max-width:850px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.summary{position:static;order:-1}}</style><link rel="stylesheet" href="/site-header.css"><script src="/site-header.js" defer></script></head><body><header class="vh-header" data-valijeando-header></header><main class="wrap"><span class="sandbox" id="bookingMode" hidden></span><h1>Finalizá tu reserva</h1><div class="steps">1 Tu selección &nbsp;›&nbsp; <b>2 Tus datos</b> &nbsp;›&nbsp; 3 Confirmación</div><div class="layout"><section class="card"><h2 class="formTitle">Datos del huésped</h2><p class="intro">Ingresá los datos de la persona responsable de la reserva.</p><div class="secure">✓ Tu habitación y tarifa fueron reconfirmadas antes de llegar a este paso.</div><form id="form"><div class="row"><div><label>Nombre</label><input id="firstName" required autocomplete="given-name"></div><div><label>Apellido</label><input id="lastName" required autocomplete="family-name"></div></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Teléfono <span class="muted">(opcional)</span></label><input id="phone" type="tel" autocomplete="tel"><button class="btn" id="submit">Confirmar reserva</button></form><div id="result"></div></section><aside class="card" id="summary"></aside></div></main><script src="/travel-party.js"></script><script>
const data=(()=>{try{return JSON.parse(sessionStorage.getItem('valijeandoCheckout')||'null')}catch{return null}})(),summary=document.getElementById('summary'),result=document.getElementById('result');
const selectedCurrency=(sessionStorage.getItem('valijeandoCurrency')||data?.currency||'USD').toUpperCase(),bnaRate=Number(sessionStorage.getItem('valijeandoBnaRate')||0);
const usd=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>selectedCurrency==='ARS'&&bnaRate>0?'ARS '+(Number(n)*bnaRate).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):usd(n);
const baseUsd=n=>selectedCurrency==='ARS'&&bnaRate>0?'<div class="paySplit">Importe base de la reserva: '+usd(n)+'</div>':'';
if(!data){summary.innerHTML='<div class="summarySection"><b>No encontramos una reserva preparada.</b><p>Volvé al hotel y elegí una habitación.</p></div>';document.getElementById('submit').disabled=true}else{
 const cp=data.cancellationPolicies||{},tag=String(cp.refundableTag||data.refundableTag||'').toUpperCase(),infos=Array.isArray(cp.cancelPolicyInfos)?cp.cancelPolicyInfos:[],first=infos.filter(x=>x&&x.cancelTime).sort((a,b)=>String(a.cancelTime).localeCompare(String(b.cancelTime)))[0];
 const cancel=cp.rooms?'<div class="cancelSummary">Condiciones por habitación: '+cp.rooms.map((r,i)=>'Habitación '+(i+1)+': '+(r.refundableTag==='RFN'?'reembolsable según sus condiciones':'no reembolsable')).join(' · ')+'</div>':tag==='RFN'?'<div class="cancelSummary good">✓ Reembolsable'+(first?' · cancelación según condiciones hasta '+esc(formatDateTime(first.cancelTime)):' según las condiciones seleccionadas')+'</div>':tag?'<div class="cancelSummary bad">✕ No reembolsable</div>':'';
 const nights=nightCount(data.checkin,data.checkout),fees=Array.isArray(data.fees)?data.fees:[],included=fees.filter(x=>x&&x.included),due=Number(data.dueAtProperty||0),total=Number(data.estimatedTotal??data.price),adults=Number(data.adults||0),adultText=adults===1?'1 adulto':adults+' adultos';
 summary.classList.add('summary');
 summary.innerHTML='<div class="summaryHead"><h2>Resumen de tu reserva</h2></div>'+
 '<div class="summarySection"><div class="summaryLabel">Tu alojamiento</div><div class="summaryHotel">'+esc(data.hotelName||'Hotel')+'</div><div class="tripGrid"><div class="tripBox"><span>Entrada</span><b>'+esc(formatDate(data.checkin))+'</b></div><div class="tripBox"><span>Salida</span><b>'+esc(formatDate(data.checkout))+'</b></div></div><div class="stayLine">'+(nights?esc(nights)+' noche'+(nights===1?'':'s')+' · ':'')+esc(ValijeandoParty.summary(ValijeandoParty.normalize(data.occupancies,adults||2)))+'</div></div>'+
 '<div class="summarySection"><div class="summaryLabel">Tu habitación</div><div class="roomName">'+esc(roomES(data.roomName||'Habitación'))+'</div>'+(data.boardName?'<div class="board">'+esc(data.boardName)+'</div>':'')+cancel+'</div>'+
 '<div class="summarySection"><div class="summaryLabel">Detalle del pago</div>'+(included.length?'<div class="detailRow"><span>Impuestos y cargos informados</span><b>Incluidos</b></div>':'')+(due>0?'<div class="detailRow"><span>A pagar en el alojamiento</span><b>'+money(due)+'</b></div>':'<div class="detailRow"><span>Cargos adicionales informados</span><b>USD 0,00</b></div>')+'<div class="totalRow"><div class="totalLabel">TOTAL</div><div class="price">'+money(total)+'</div></div>'+baseUsd(total)+(due>0?'<p class="paySplit"><b>'+money(data.price)+'</b> en Valijeando<br><b>'+money(due)+'</b> en el alojamiento</p>':'<p class="paySplit">No se informan importes adicionales para pagar en el alojamiento.</p>')+'</div>'+
 '<div class="summarySection"><div class="billing"><b>Comprobante y facturación</b>La confirmación muestra el código de reserva y el estado del correo y de Mi cuenta. Conservá siempre el código.</div></div>'
}
function formatDate(s){if(!s)return '';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function formatDateTime(s){if(!s)return '';const d=new Date(String(s).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?s:d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' GMT'}
function nightCount(a,b){const x=new Date(a+'T00:00:00Z'),y=new Date(b+'T00:00:00Z'),n=Math.round((y-x)/86400000);return Number.isFinite(n)&&n>0?n:0}
function roomES(s){s=String(s||'Habitación');const rules=[[/Double Room Superior with Mountain View/ig,'Habitación Doble Superior con Vista a la Montaña'],[/Standard Double Room with One Bunk Bed/ig,'Habitación Doble Estándar con Cucheta'],[/Standard Apartment with 1 Double Bed and 1 Extra Bed/ig,'Apartamento Estándar con 1 cama doble y 1 cama adicional'],[/Twin Room Superior/ig,'Habitación Superior con dos camas'],[/Double room King bed - Superior/ig,'Habitación Superior con cama King'],[/TRIPLE SUPERIOR NON SMOKING/ig,'Habitación Triple Superior para no fumadores'],[/Superior King Room/ig,'Habitación Superior con cama King'],[/Superior Twin Room/ig,'Habitación Superior con dos camas'],[/Double Room Standard/ig,'Habitación Doble Estándar'],[/Standard Double Room/ig,'Habitación Doble Estándar'],[/Double Room/ig,'Habitación Doble'],[/Triple Room/ig,'Habitación Triple'],[/Twin Room/ig,'Habitación con dos camas'],[/Single Room/ig,'Habitación Individual']];for(const [a,b] of rules)s=s.replace(a,b);return s}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const submit=document.getElementById('submit'),form=document.getElementById('form'),modeBadge=document.getElementById('bookingMode');
let modeReady=false,busy=false,confirmed=null;
const confirmationKey=data?.prebookId?'valijeandoConfirmation:'+data.prebookId:'';
try{confirmed=confirmationKey?JSON.parse(sessionStorage.getItem(confirmationKey)||'null'):null}catch{}
const rooms=data?ValijeandoParty.normalize(data.occupancies,Number(data.adults||2)):[];
rooms.slice(1).forEach((r,i)=>{
 const field=document.createElement('div');field.className='row';field.innerHTML='<div><label for="roomFirst'+i+'">Nombre del huésped · habitación '+(i+2)+'</label><input id="roomFirst'+i+'" required autocomplete="off"></div><div><label for="roomLast'+i+'">Apellido · habitación '+(i+2)+'</label><input id="roomLast'+i+'" required autocomplete="off"></div>';
 form.insertBefore(field,submit);
});
function showConfirmation(d){
 confirmed=d;submit.disabled=true;submit.textContent='Reserva confirmada';
 if(confirmationKey)sessionStorage.setItem(confirmationKey,JSON.stringify(d));
 const account=d.saved?'<p class="confirmNote">✓ Reserva guardada en <a href="/mi-cuenta.html">Mi cuenta</a>. Ingresá con el email de la reserva.</p>':'<p class="err">'+esc(d.saveError||'La reserva se confirmó, pero no pudo guardarse en Mi cuenta. Conservá el código.')+'</p>';
 const mail=d.emailSent?'<p class="confirmNote">✓ Correo de confirmación enviado.</p>':d.alreadyConfirmed?'<p class="confirmNote">Esta reserva ya estaba confirmada. No se creó otra reserva.</p>':'<p class="err">'+esc(d.emailError||'No pudimos enviar el correo de confirmación. Conservá el código.')+'</p>';
 result.innerHTML='<div class="ok"><h2>'+((d.sandbox||d.bookingEnvironment==='sandbox')?'✓ Reserva de prueba confirmada':'✓ ¡Tu reserva está confirmada!')+'</h2>'+((d.sandbox||d.bookingEnvironment==='sandbox')?'<p class="confirmNote"><strong>Sin cobro. Esta prueba no tiene validez para alojarte en el hotel.</strong></p>':'')+'<p class="okLead">El proveedor confirmó tu reserva en <b>'+esc(data.hotelName||'el alojamiento')+'</b>.</p><div class="confirmGrid"><div class="confirmBox"><span>Entrada</span><b>'+esc(formatDate(data.checkin))+'</b></div><div class="confirmBox"><span>Salida</span><b>'+esc(formatDate(data.checkout))+'</b></div><div class="confirmBox"><span>Habitaciones y huéspedes</span><b>'+esc(ValijeandoParty.summary(rooms))+'</b></div><div class="confirmBox"><span>Total</span><b>'+money(data.estimatedTotal??data.price)+'</b></div></div><div class="confirmCode"><span>Código de reserva</span><b>'+esc(d.bookingId)+'</b></div>'+account+mail+'<p class="confirmNote">Guardá el código y los datos de tu reserva.</p><div class="confirmActions"><a class="homeBtn" href="/">Volver a Valijeando</a></div></div>';
}
submit.disabled=true;
if(confirmed&&data)showConfirmation(confirmed);
window.valijeandoBookingMode=fetch('/api/nuitee-prebook').then(r=>r.json()).then(d=>{
 modeReady=(d.bookingEnvironment==='sandbox'||(d.bookingEnvironment==='production'&&d.bookingEnabled===true&&data?.paymentMethod==='TRANSACTION_ID'))&&(!data?.bookingEnvironment||data.bookingEnvironment===d.bookingEnvironment);modeBadge.hidden=d.bookingEnvironment==='production'&&modeReady;
 modeBadge.textContent=modeReady?'RESERVA DE PRUEBA · sin cobro ni alojamiento real':'Las reservas no están disponibles en este momento.';
 if(!confirmed)submit.disabled=!modeReady||!data;
 return d;
}).catch(()=>{modeBadge.hidden=false;modeBadge.textContent='No pudimos verificar la disponibilidad de reservas.'});
form.onsubmit=async e=>{
 e.preventDefault();if(!data||!modeReady||busy||confirmed)return;
 busy=true;submit.disabled=true;submit.textContent='Confirmando reserva…';result.innerHTML='';
 try{
  const roomGuests=rooms.slice(1).map((r,i)=>({firstName:document.getElementById('roomFirst'+i).value,lastName:document.getElementById('roomLast'+i).value}));
  const r=await fetch('/api/nuitee-book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prebookId:data.prebookId,firstName:firstName.value,lastName:lastName.value,email:email.value,phone:phone.value,roomGuests,reservation:{...data,occupancies:rooms,bnaRate:bnaRate||null,displayCurrency:selectedCurrency}})});
  const d=await r.json();
  if(!r.ok){const err=Error(d.error||'No se pudo confirmar');err.uncertain=d.reason==='booking_uncertain';throw err}
  if(!d.bookingId){const err=Error('No pudimos verificar la confirmación. Consultá Mi cuenta antes de repetir la reserva.');err.uncertain=true;throw err}
  showConfirmation(d);
 }catch(err){result.innerHTML='<div class="err">'+esc(err.message)+'</div>';submit.disabled=!!err.uncertain;submit.textContent=err.uncertain?'Confirmación pendiente de verificar':'Volver a intentar'}
 finally{busy=false}
};
</script><script src="/hotel-payment.js" defer></script></body></html>
