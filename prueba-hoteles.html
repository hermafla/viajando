<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prueba hoteles | Valijeando</title>
<link rel="icon" href="/valijeando-favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#07558f;padding:18px 24px}header img{width:210px;max-width:70vw;display:block}
main{width:min(1180px,94%);margin:28px auto}.hero{background:linear-gradient(135deg,#07558f,#0b6da8);color:#fff;padding:24px 26px;border-radius:18px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:rgba(255,255,255,.88);line-height:1.5}
.search{display:grid;grid-template-columns:1.4fr 1fr 1fr .7fr auto;gap:10px;background:#fff;padding:16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin-bottom:22px}
label{font-size:12px;font-weight:800;color:#64748b;display:block;margin-bottom:6px}input{width:100%;border:1px solid #dbe3ee;border-radius:10px;padding:12px;font-size:15px}button{border:0;border-radius:11px;background:#f58220;color:#fff;font-weight:800;padding:12px 22px;cursor:pointer;align-self:end;height:43px}
.status{margin:16px 2px;color:#475569}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.07);display:flex;flex-direction:column}.card img{width:100%;height:205px;object-fit:cover;background:#e9eef5}.body{padding:16px}.name{font-size:19px;font-weight:800;margin-bottom:6px}.meta{font-size:14px;color:#64748b;line-height:1.5}.rating{font-weight:800;color:#07558f}.price{margin-top:14px;border-top:1px solid #eef2f7;padding-top:13px}.price strong{font-size:24px}.small{font-size:12px;color:#64748b;margin-top:4px}.badge{display:inline-block;background:#eaf4fb;color:#07558f;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:8px}.error{background:#fff0f0;color:#9b1c1c;padding:14px;border-radius:12px}
@media(max-width:900px){.search{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{width:94%;margin-top:18px}.search,.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head>
<body><header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header>
<main>
<section class="hero"><h1>Prueba técnica de hoteles</h1><p>Buscador temporal conectado a Nuitee/LiteAPI. No modifica el buscador actual de Valijeando.</p></section>
<form class="search" id="search">
<div><label>Destino</label><input id="city" value="Rio de Janeiro" required></div>
<div><label>Entrada</label><input id="checkin" type="date" value="2027-01-15" required></div>
<div><label>Salida</label><input id="checkout" type="date" value="2027-01-17" required></div>
<div><label>Adultos</label><input id="adults" type="number" min="1" max="8" value="2" required></div>
<button type="submit">Buscar hoteles</button>
</form>
<div class="status" id="status">Listo para buscar.</div><section class="grid" id="results"></section>
</main>
<script>
const form=document.getElementById('search'),status=document.getElementById('status'),results=document.getElementById('results');
const money=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
form.addEventListener('submit',async e=>{e.preventDefault();results.innerHTML='';status.textContent='Buscando disponibilidad y precios…';
const q=new URLSearchParams({city:city.value,checkin:checkin.value,checkout:checkout.value,adults:adults.value,countryCode:'BR',currency:'USD',guestNationality:'AR'});
try{const r=await fetch('/api/nuitee-hotels?'+q);const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo consultar Nuitee');
status.textContent=data.hotels.length?data.hotels.length+' hoteles con tarifa encontrados · Sandbox':'No encontramos hoteles con tarifa para esas fechas.';
results.innerHTML=data.hotels.map(h=>`<article class="card"><img src="${h.photo||''}" alt="${h.name}" loading="lazy"><div class="body"><span class="badge">SANDBOX</span><div class="name">${h.name}</div><div class="meta">${h.stars?'★ '.repeat(Math.min(h.stars,5)):''}<span class="rating">${h.rating?h.rating+'/10':''}</span>${h.reviewCount?' · '+Number(h.reviewCount).toLocaleString('es-AR')+' reseñas':''}<br>${h.address||''}</div><div class="price"><span>Desde</span><br><strong>${money(h.retailRate)}</strong><div class="small">Tarifa para la estadía seleccionada. Impuestos/cargos no incluidos se informarán por separado.</div></div></div></article>`).join('');
}catch(err){status.innerHTML='<div class="error">'+err.message+'</div>';}});
</script></body></html>
