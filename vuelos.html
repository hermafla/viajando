<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparar vuelos | Valijeando</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#14213d}.top{background:white;padding:20px}.wrap{max-width:1050px;margin:auto}.hero{background:linear-gradient(110deg,#087cf0,#36a0f5);color:white;padding:42px 20px}.card{background:white;margin:28px auto;padding:26px;border-radius:20px;box-shadow:0 10px 30px #1232}.route{font-size:22px;font-weight:800}.muted{color:#687386}.btn{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:12px;background:#087cf0;color:white;text-decoration:none;font-weight:700}.offers{display:grid;gap:14px;margin-top:18px}.offer{border:1px solid #dbe5f1;border-radius:15px;padding:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.price{font-size:24px;font-weight:800}.tag{font-size:12px;background:#eaf7ee;padding:5px 9px;border-radius:20px}.warn{background:#fff8e6;padding:12px;border-radius:10px;margin-top:15px}@media(max-width:650px){.offer{display:block}.price{margin-top:12px}}</style></head><body><div class="top"><div class="wrap"><b>🧳 Valijeando</b> <a href="index.html" style="float:right">← Cambiar búsqueda</a></div></div><div class="hero"><div class="wrap"><h1>Compará vuelos</h1><p id="route"></p></div></div><div class="wrap"><div class="card"><div class="route" id="summary"></div><p class="muted">Estamos consultando las opciones reales disponibles para esta ruta. No vamos a mostrar destinos sugeridos ni precios inventados.</p><div id="status">Buscando vuelos…</div><a class="btn" href="index.html">Modificar búsqueda</a></div></div><script>
const p=new URLSearchParams(location.search),o=p.get("origen")||"",d=p.get("destino")||"",ida=p.get("fechaIda")||"",vuelta=p.get("fechaVuelta")||"",n=p.get("viajeros")||"1";
document.getElementById("route").textContent=o+" → "+d;
document.getElementById("summary").textContent=ida+" → "+vuelta+" · "+n+" viajero(s)";
const oi=p.get("origenIata"),di=p.get("destinoIata");
if(!oi||!di){document.getElementById("status").textContent="No pudimos identificar los aeropuertos. Volvé a la búsqueda y elegí origen y destino de la lista."}
else{fetch("/api/vuelos?origin="+encodeURIComponent(oi)+"&destination="+encodeURIComponent(di)+"&fechaIda="+encodeURIComponent(ida)+"&fechaVuelta="+encodeURIComponent(vuelta)+"&viajeros="+encodeURIComponent(n)).then(r=>r.json()).then(data=>{const s=document.getElementById("status");if(!data.ok){s.textContent=data.error||"No pudimos consultar vuelos.";return}const offers=data.offers||[];if(offers.length){s.innerHTML='<div class="tag">Precios encontrados para las fechas solicitadas</div><div class="offers">'+offers.map(o=>'<div class="offer"><div><b>'+(o.airline?'Aerolínea '+o.airline:'Vuelo')+'</b><br><span class="muted">'+ida+' → '+vuelta+(o.transfers!==null?' · '+(o.transfers===0?'Directo':o.transfers+' escala(s)'):'')+'</span></div><div class="price">'+o.currency+' '+Math.round(o.price)+'</div></div>').join('')+'</div><p class="muted">Fuente: Travelpayouts/Aviasales. Son precios encontrados previamente y pueden cambiar al reservar.</p>';return}const near=data.nearby||[];s.innerHTML='<div class="warn"><b>No encontramos un precio para exactamente '+ida+' → '+vuelta+'.</b><br>No mostramos otro día como si fuera tu fecha.</div>'+(near.length?'<p class="muted">Sí hay precios recientes para otras fechas del mismo mes. Más adelante los mostraremos separados como alternativas flexibles.</p>':'');}).catch(()=>document.getElementById("status").textContent="No pudimos consultar vuelos en este momento.");}
</script></body></html>
