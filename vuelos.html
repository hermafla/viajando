<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparar vuelos | Valijeando</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#14213d}.top{background:white;padding:20px}.wrap{max-width:1050px;margin:auto}.hero{background:linear-gradient(110deg,#087cf0,#36a0f5);color:white;padding:42px 20px}.card{background:white;margin:28px auto;padding:26px;border-radius:20px;box-shadow:0 10px 30px #1232}.route{font-size:22px;font-weight:800}.muted{color:#687386}.btn{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:12px;background:#087cf0;color:white;text-decoration:none;font-weight:700}</style></head><body><div class="top"><div class="wrap"><b>🧳 Valijeando</b> <a href="index.html" style="float:right">← Cambiar búsqueda</a></div></div><div class="hero"><div class="wrap"><h1>Compará vuelos</h1><p id="route"></p></div></div><div class="wrap"><div class="card"><div class="route" id="summary"></div><p class="muted">Estamos consultando las opciones reales disponibles para esta ruta. No vamos a mostrar destinos sugeridos ni precios inventados.</p><div id="status">Buscando vuelos…</div><a class="btn" href="index.html">Modificar búsqueda</a></div></div><script>
const p=new URLSearchParams(location.search),o=p.get("origen")||"",d=p.get("destino")||"",ida=p.get("fechaIda")||"",vuelta=p.get("fechaVuelta")||"",n=p.get("viajeros")||"1";
document.getElementById("route").textContent=o+" → "+d;
document.getElementById("summary").textContent=ida+" → "+vuelta+" · "+n+" viajero(s)";
const oi=p.get("origenIata"),di=p.get("destinoIata");
if(!oi||!di){document.getElementById("status").textContent="No pudimos identificar los aeropuertos. Volvé a la búsqueda y elegí origen y destino de la lista."}
else{fetch("/api/vuelos?origen="+encodeURIComponent(oi)+"&destino="+encodeURIComponent(di)+"&fechaIda="+encodeURIComponent(ida)+"&fechaVuelta="+encodeURIComponent(vuelta)+"&viajeros="+encodeURIComponent(n)).then(r=>r.json()).then(data=>{document.getElementById("status").textContent=Array.isArray(data)&&data.length?"Encontramos opciones. Estamos preparando la comparativa detallada.":"No encontramos precios reales para estas fechas en la fuente disponible.";}).catch(()=>document.getElementById("status").textContent="No pudimos consultar vuelos en este momento.");}
</script></body></html>
