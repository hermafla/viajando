function showRoom(o,roomById){const r=roomById.get(String(o.mappedRoomId))||{},photos=(r.photos||[]).filter(p=>p&&!/no.?image/i.test(p)),amen=Array.isArray(r.amenities)?r.amenities.map(a=>trFacility(typeof a==='string'?a:(a.name||a.facilityName||''))).filter(Boolean):[],beds=Array.isArray(r.bedTypes)?r.bedTypes:[],name=roomES(o.roomName||r.roomName||'Habitación'),desc=r.description?descES(r.description):'',size=r.roomSize||r.size||r.sizeSquareMeters||'',maxOcc=Number(r.maxOccupancy||0),body=document.getElementById('roomDetailBody');let pos=0;const lower=x=>String(x||'').toLowerCase(),pick=rx=>amen.filter(a=>rx.test(lower(a))),used=new Set(),group=(title,items)=>{const clean=[...new Set(items)].filter(x=>x&&!used.has(x));clean.forEach(x=>used.add(x));return clean.length?'<section class="roomGroup"><h3>'+title+'</h3><div class="roomList">'+clean.map(x=>'<div class="roomItem">'+esc(x)+'</div>').join('')+'</div></section>':''};const bath=pick(/baño|ducha|toall|papel hig|jabón|aseo|secador|inodoro|lavamanos|bañera|bidé/),views=pick(/vista|balcón|terraza/),general=pick(/aire acondicionado|calefacción|televisor|tv|escritorio|minibar|caja de seguridad|ropa de cama|perchero|insonoriz|acceso con|llave|tarjeta|wifi/),other=amen.filter(a=>!bath.includes(a)&&!views.includes(a)&&!general.includes(a));const bedText=beds.map(b=>typeof b==='string'?b:(b.name||b.bedType||'')).filter(Boolean).join(', ');const facts=(maxOcc?'<span class="roomFact">👥 Hasta '+maxOcc+' huéspedes</span>':'')+(bedText?'<span class="roomFact">🛏 '+esc(bedText)+'</span>':'')+(size?'<span class="roomFact">📐 '+esc(size)+(String(size).match(/^\\d/)?' m²':'')+'</span>':'')+(views.length?'<span class="roomFact">△ '+esc(views[0])+'</span>':'');const gallery=photos.length?'<div><div class="roomHero"><img id="roomHeroImg" src="'+esc(photos[0])+'" alt="'+esc(name)+'">'+(photos.length>1?'<button class="roomNav roomPrev" id="roomPrev" aria-label="Foto anterior">‹</button><button class="roomNav roomNext" id="roomNext" aria-label="Foto siguiente">›</button><span class="roomCount" id="roomCount">1 / '+photos.length+'</span>':'')+'</div>'+(photos.length>1?'<div class="roomThumbs">'+photos.slice(0,6).map((p,i)=>'<img class="roomThumb '+(i===0?'active':'')+'" data-photo="'+i+'" src="'+esc(p)+'" alt="Foto '+(i+1)+'">').join('')+'</div>':'')+'</div>':'<div></div>';body.innerHTML='<div class="roomDetailGrid">'+gallery+'<div class="roomDetailInfo"><h2>'+esc(name)+'</h2>'+(maxOcc?'<div class="roomSub">Hasta '+maxOcc+' huéspedes</div>':'')+(facts?'<div class="roomFacts">'+facts+'</div>':'')+group('🛏 Habitación',general)+group('🛁 Baño privado',bath)+group('△ Vistas',views)+group('Servicios adicionales',other)+(desc?'<div class="roomDesc">'+esc(desc)+'</div>':'')+(o.boardName?'<div class="roomMeal">'+esc(boardES(o.boardName))+'</div>':'')+'</div></div>';if(photos.length>1){const draw=()=>{document.getElementById('roomHeroImg').src=photos[pos];document.getElementById('roomCount').textContent=(pos+1)+' / '+photos.length;document.querySelectorAll('.roomThumb').forEach(x=>x.classList.toggle('active',+x.dataset.photo===pos))};document.getElementById('roomPrev').onclick=()=>{pos=(pos-1+photos.length)%photos.length;draw()};document.getElementById('roomNext').onclick=()=>{pos=(pos+1)%photos.length;draw()};document.querySelectorAll('.roomThumb').forEach(x=>x.onclick=()=>{pos=+x.dataset.photo;draw()})}document.getElementById('roomDetail').classList.add('open')}
document.getElementById('roomDetailClose').onclick=()=>document.getElementById('roomDetail').classList.remove('open');document.getElementById('roomDetail').onclick=e=>{if(e.target.id==='roomDetail')e.currentTarget.classList.remove('open')};
function selectRate(o){window.selectedOffer=o;const ssp=Number(o.suggestedSellingPrice),price=Number(o.retailRate),validSsp=Number.isFinite(ssp)&&ssp>price;document.getElementById('selection').innerHTML='<h3>'+esc(roomES(o.roomName||'Habitación'))+'</h3>'+(o.boardName?'<p>'+esc(boardES(o.boardName))+'</p>':'')+(o.refundableTag?cancellationES(o):'')+'<div class="priceBig">'+money(o.estimatedTotal??price)+'</div>'+(validSsp?'<div class="compare"><div class="compareRow"><span>Referencia pública</span><span class="strike">'+money(ssp)+'</span></div><div class="compareRow"><b>Valijeando</b><b>'+money(price)+'</b></div><div class="saving">Ahorrás '+money(ssp-price)+'</div></div>':'')+'<button class="bookBtn" id="bookBtn">Ir al pago</button><div id="prebookBox" class="finalBox" hidden></div>';document.getElementById('bookBtn').onclick=()=>prebook(o);document.getElementById('booking').scrollIntoView({behavior:'smooth',block:'start'})}
async function prebook(o){const btn=document.getElementById('bookBtn'),box=document.getElementById('prebookBox');btn.disabled=true;btn.textContent='Reconfirmando…';box.hidden=true;try{const r=await fetch('/api/nuitee-prebook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offerId:o.offerId})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo reconfirmar');const finalPrice=d.price!=null?Number(d.price):null;sessionStorage.setItem('valijeandoCheckout',JSON.stringify({prebookId:d.prebookId,hotelId:id,hotelName:window.currentHotelName,roomName:o.roomName||'Habitación',boardName:boardES(o.boardName||''),checkin,checkout,adults,price:finalPrice,estimatedTotal:d.estimatedTotal,dueAtProperty:d.dueAtProperty,fees:d.fees||[],cancellationPolicies:d.cancellationPolicies||[]}));btn.textContent='Verificando disponibilidad…';location.href='/prueba-hotel-checkout.html'}catch(e){box.hidden=false;const unavailable=/availability|available/i.test(e.message);box.innerHTML='<span style="color:#9b1c1c">'+(unavailable?'Esta tarifa acaba de dejar de estar disponible. Elegí otra habitación o volvé a buscar.':esc(e.message))+'</span>';btn.textContent='Volver a intentar';btn.disabled=false}}
function open(i){idx=i;big.src=imgs[idx];modal.classList.add('open')} function step(n){if(!imgs.length)return;idx=(idx+n+imgs.length)%imgs.length;big.src=imgs[idx]}
document.querySelector('.close').onclick=()=>modal.classList.remove('open');document.querySelector('.prev').onclick=()=>step(-1);document.querySelector('.next').onclick=()=>step(1);modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
