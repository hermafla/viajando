<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hotel | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#07558f;padding:18px 24px}header img{width:210px}.wrap{width:min(1180px,94%);margin:24px auto}.back{color:#07558f;font-weight:800;text-decoration:none}.top{margin:18px 0}.top h1{margin:6px 0;font-size:30px}.muted{color:#64748b}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:210px 210px;gap:8px;border-radius:18px;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer}.gallery img:first-child{grid-row:1/3}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.content{min-width:0}.rate{border:1px solid #dbe3ee;border-radius:14px;padding:14px;margin:14px 0;background:#fff}.rateGrid{display:grid;grid-template-columns:210px minmax(0,1fr) 170px;gap:18px;align-items:center}.ratePhoto{width:210px;height:145px;object-fit:cover;border-radius:11px;background:#eef2f7}.rateInfo h3{margin:0 0 8px}.rateInfo p{margin:6px 0}.rateAction{text-align:right}.ratePrice{font-size:22px;font-weight:900;white-space:nowrap;margin-bottom:10px}.chooseBtn{border:0;border-radius:10px;background:#07558f;color:#fff;font-weight:900;padding:11px 16px;cursor:pointer}.booking{position:sticky;top:18px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px #00000012}.booking .priceBig{font-size:30px;font-weight:900;margin:8px 0}.saving{background:#eaf8ef;color:#176b37;padding:10px 12px;border-radius:10px;font-weight:800;margin:12px 0}.bookBtn{display:block;width:100%;border:0;border-radius:11px;background:#f58220;color:#fff;font-weight:900;padding:14px;cursor:pointer;font-size:16px}.bookBtn:disabled{opacity:.55;cursor:not-allowed}.compare{border-top:1px solid #e5e7eb;margin-top:14px;padding-top:14px}.compareRow{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.strike{text-decoration:line-through;color:#64748b}.panel{background:#fff;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 8px 24px #0000000c}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#eef6fb;border-radius:999px;padding:8px 11px;font-size:13px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.room{border:1px solid #e3e9f1;border-radius:13px;padding:14px}.room img{width:100%;height:170px;object-fit:cover;border-radius:10px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}.modal.open{display:flex}.modal img{max-width:92vw;max-height:86vh}.close{position:absolute;right:25px;top:20px;color:#fff;font-size:35px;cursor:pointer}.nav{position:absolute;top:50%;color:#fff;font-size:45px;cursor:pointer;padding:20px}.prev{left:10px}.next{right:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.booking{position:static;order:-1}}@media(max-width:700px){.rateGrid{grid-template-columns:1fr}.ratePhoto{width:100%;height:200px}.rateAction{text-align:left}.chooseBtn{width:100%}.gallery{grid-template-columns:1fr 1fr;grid-template-rows:220px 120px}.gallery img:first-child{grid-column:1/3;grid-row:auto}.gallery img:nth-child(n+4){display:none}.rooms{grid-template-columns:1fr}.top h1{font-size:25px}}
</style></head><body><header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header><main class="wrap"><a class="back" href="/prueba-hoteles.html">← Volver a hoteles</a><div id="app"><p>Cargando hotel…</p></div></main><div class="modal" id="modal"><span class="close">×</span><span class="nav prev">‹</span><img id="big"><span class="nav next">›</span></div><script>
const qs=new URLSearchParams(location.search), id=qs.get('hotelId'), offerId=qs.get('offerId')||'', app=document.getElementById('app');
let imgs=[],idx=0; const modal=document.getElementById('modal'),big=document.getElementById('big');
const money=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const strip=s=>{const d=document.createElement('div');d.innerHTML=s||'';return (d.textContent||'').replace(/([a-záéíóú])([A-ZÁÉÍÓÚ])/g,'$1 · $2').replace(/\s+/g,' ').trim()};
const facilityES={'Fitness facilities':'Gimnasio','WiFi available':'WiFi disponible','Free WiFi':'WiFi gratis','Non-smoking rooms':'Habitaciones para no fumadores','Air conditioning':'Aire acondicionado','Fitness center':'Gimnasio','Swimming pool':'Piscina','24-hour front desk':'Recepción 24 horas','Room service':'Servicio a la habitación','Family rooms':'Habitaciones familiares','Lift / Elevator':'Ascensor','Bar':'Bar','Facilities for disabled guests':'Accesibilidad','Outdoor pool':'Piscina exterior','Sun terrace':'Terraza','Daily housekeeping':'Limpieza diaria','Wheelchair accessible':'Acceso para silla de ruedas','Snack bar':'Snack bar','Coffee Shop on site':'Cafetería'};
const trFacility=x=>facilityES[x]||x;
const roomES=s=>{s=String(s||'Habitación');const rules=[[/Twin Room Superior/ig,'Habitación Superior con dos camas'],[/Double room King bed - Superior/ig,'Habitación Superior con cama King'],[/TRIPLE SUPERIOR NON SMOKING/ig,'Habitación Triple Superior para no fumadores'],[/Superior King Room/ig,'Habitación Superior con cama King'],[/Superior Twin Room/ig,'Habitación Superior con dos camas'],[/Executive King Room/ig,'Habitación Ejecutiva con cama King'],[/Luxury Room with King-Size Bed/ig,'Habitación Luxury con cama King']];for(const [a,b] of rules)s=s.replace(a,b);return s};
const boardES=s=>String(s||'').replace(/Breakfast Included/ig,'Desayuno incluido').replace(/Room Only/ig,'Solo alojamiento').replace(/Half Board/ig,'Media pensión').replace(/Full Board/ig,'Pensión completa');
const refundES=s=>{s=String(s||'');if(/NRFN|non.?refundable/i.test(s))return 'No reembolsable';if(/refundable/i.test(s))return 'Reembolsable';return s};
const looksEnglish=s=>/\b(room|bed|balcony|bathroom|shower|internet|free wi.?fi|air conditioning|housekeeping|non-smoking|television|cable|minibar|desk|safe|hairdryer)\b/i.test(String(s||''));
const descES=s=>{s=strip(s);const dict=[[/This air-conditioned twin room features a balcony, a mini-bar, a flat-screen TV with cable channels and ironing facilities\. Bathroom is private and includes a hairdryer\./ig,'Esta habitación con dos camas cuenta con aire acondicionado, balcón, minibar, TV de pantalla plana con canales por cable y equipo de planchado. El baño es privado e incluye secador de pelo.'],[/This air-conditioned room features a balcony, a mini-bar, a flat-screen TV with cable channels and ironing facilities\. Bathroom is private and includes a hairdryer\./ig,'Esta habitación cuenta con aire acondicionado, balcón, minibar, TV de pantalla plana con canales por cable y equipo de planchado. El baño es privado e incluye secador de pelo.']];for(const [a,b] of dict)s=s.replace(a,b);if(looksEnglish(s)){const bits=[];if(/balcony/i.test(s))bits.push('balcón');if(/free wi.?fi|internet.*free/i.test(s))bits.push('WiFi gratis');if(/air conditioning/i.test(s))bits.push('aire acondicionado');if(/non-smoking/i.test(s))bits.push('no fumadores');if(/minibar/i.test(s))bits.push('minibar');if(/cable|television|TV/i.test(s))bits.push('TV por cable');if(/safe/i.test(s))bits.push('caja de seguridad');if(/desk/i.test(s))bits.push('escritorio');if(/hairdryer/i.test(s))bits.push('secador de pelo');if(/private bathroom/i.test(s))bits.push('baño privado');if(/housekeeping/i.test(s))bits.push('limpieza diaria');if(bits.length)return 'Incluye '+[...new Set(bits)].join(', ')+'.';return 'Consultá los detalles y servicios incluidos de esta habitación.'}return s};
const importantES=s=>{s=strip(s);const rules=[[/According to the Brazilian Federal Law 8\.069\/1990, minors under 18 years of age cannot check into hotels unless they are accompanied by their parents or a designated adult\./ig,'De acuerdo con la Ley Federal brasileña 8.069/1990, los menores de 18 años no pueden registrarse en hoteles a menos que estén acompañados por sus padres o por un adulto designado.'],[/If the minor is accompanied by an adult other than (?:his|their) parents, it will be necessary to present a written authori[sz]ation for the minor to check into the hotel\./ig,'Si el menor está acompañado por un adulto que no sea uno de sus padres, deberá presentar una autorización escrita para poder registrarse en el hotel.'],[/Such authorisation must be notarised and signed by both parents\./ig,'Dicha autorización deberá estar certificada por escribano y firmada por ambos padres.'],[/All minors under 18 years of age also need to present a valid ID with photo, to prove their identity and that of his\/her parents\./ig,'Todos los menores de 18 años también deberán presentar un documento de identidad válido con fotografía que acredite su identidad y la de sus padres.'],[/This must be presented even if a minor is accompanied by his\/her parents\./ig,'Este documento deberá presentarse incluso si el menor está acompañado por sus padres.'],[/Please note that the swimming pool is closed on Mondays\./ig,'Tené en cuenta que la piscina permanece cerrada los lunes.'],[/A deposit may be required at the property\./ig,'El alojamiento puede solicitar un depósito.']];for(const [a,b] of rules)s=s.replace(a,b);return s};
const checkin=qs.get('checkin')||'', checkout=qs.get('checkout')||'', adults=qs.get('adults')||'', searchPrice=Number(qs.get('price')), ssp=Number(qs.get('ssp'));
fetch('/api/nuitee-hotel-detail?hotelId='+encodeURIComponent(id||'')).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo cargar el hotel');return j}).then(({hotel:h})=>{
 const images=Array.isArray(h.images)?h.images:[], facilities=Array.isArray(h.facilities)?h.facilities:[], rooms=Array.isArray(h.rooms)?h.rooms:[];
 imgs=images.map(x=>x&&x.url).filter(Boolean); document.title=(h.name||'Hotel')+' | Valijeando';
 const gal=images.slice(0,5).map((x,i)=>'<img src="'+esc(x.url)+'" alt="'+esc(x.caption||h.name)+'" data-i="'+i+'">').join('');
 const fac=facilities.slice(0,30).map(x=>'<span class="chip">'+esc(trFacility(x))+'</span>').join('');
 const roomById=new Map(rooms.map(r=>[String(r.id),r]));
 const validPrice=Number.isFinite(searchPrice)&&searchPrice>0, validSsp=Number.isFinite(ssp)&&ssp>searchPrice;
 const offers=(()=>{try{return JSON.parse(sessionStorage.getItem('hotelOffers:'+id)||'[]')}catch{return []}})();
 const rateCards=offers.length?'<section class="panel"><h2>Elegí tu habitación</h2><p class="muted">Fotos, características y tarifas disponibles para las fechas de tu búsqueda.</p>'+offers.map((o,i)=>{const r=roomById.get(String(o.mappedRoomId))||null, photos=r?(r.photos||[]).filter(p=>p&&!/no.?image/i.test(p)):[], photo=photos[0]||'', desc=r&&r.description?descES(r.description):'', cap=r&&r.maxOccupancy?'Hasta '+r.maxOccupancy+' huéspedes':'';return '<div class="rate"><div class="rateGrid">'+(photo?'<img class="ratePhoto" src="'+esc(photo)+'" alt="'+esc(roomES(o.roomName||r?.roomName||'Habitación'))+'" onerror="this.style.display=\'none\'">':'<div class="ratePhoto"></div>')+'<div class="rateInfo"><h3>'+esc(o.roomName||r?.roomName||'Habitación')+'</h3>'+(cap?'<p class="muted">'+esc(cap)+'</p>':'')+(desc?'<p>'+esc(desc)+'</p>':'')+(o.boardName?'<p><b>'+esc(boardES(o.boardName))+'</b></p>':'')+(o.refundableTag?'<p class="small"><b>'+esc(refundES(o.refundableTag))+'</b></p>':'')+(Number(o.dueAtProperty)>0?'<p class="small">⚠ + '+money(o.dueAtProperty)+' a pagar en el alojamiento</p>':'<p class="small">✓ Sin cargos informados para pagar en el alojamiento</p>')+(Array.isArray(o.fees)&&o.fees.length?'<p class="small">'+(o.fees.every(f=>f.included)?'✓ Impuestos y cargos informados incluidos':'Impuestos y cargos detallados en la tarifa')+'</p>':'')+'</div><div class="rateAction"><div class="ratePrice">'+money(o.estimatedTotal??o.retailRate)+'</div><div class="small">Precio total</div>'+(Number(o.dueAtProperty)>0?'<div class="small">'+money(o.retailRate)+' en Valijeando<br>'+money(o.dueAtProperty)+' en el alojamiento</div>':'<div class="small">Se paga en Valijeando</div>')+'<button class="chooseBtn" data-rate="'+i+'">Elegir habitación</button></div></div></div>'}).join('')+'</section>':'<section class="panel"><h2>Habitaciones</h2><p>Volvé a la búsqueda para consultar disponibilidad y precios de estas fechas.</p></section>';
 const booking='<aside class="booking" id="booking"><b>Tu selección</b><p class="muted">'+(checkin&&checkout?esc(checkin)+' → '+esc(checkout)+(adults?' · '+esc(adults)+' adulto(s)':''):'Elegí una habitación para continuar.')+'</p><div id="selection"><p>Seleccioná una de las habitaciones disponibles.</p></div></aside>';
 const content='<div class="content"><section class="top"><span class="muted">SANDBOX</span><h1>'+esc(h.name)+'</h1><div>'+('★'.repeat(Math.min(Number(h.stars)||0,5)))+' · '+esc(h.address)+(h.city?' · '+esc(h.city):'')+'</div></section>'+(gal?'<section class="gallery">'+gal+'</section>':'')+'<section class="panel"><h2>Sobre el hotel</h2><p>'+esc(strip(h.description||'Información del alojamiento disponible al seleccionar una tarifa.'))+'</p></section>'+(fac?'<section class="panel"><h2>Servicios</h2><div class="chips">'+fac+'</div></section>':'')+rateCards+(h.importantInformation?'<section class="panel"><h2>Información importante</h2><p>'+esc(importantES(h.importantInformation))+'</p></section>':'')+'</div>';
 app.innerHTML='<div class="layout">'+content+booking+'</div>';
 document.querySelectorAll('.gallery img').forEach(el=>el.onclick=()=>open(+el.dataset.i));
 document.querySelectorAll('.chooseBtn').forEach(b=>b.onclick=()=>selectRate(offers[+b.dataset.rate]));
}).catch(e=>app.innerHTML='<div class="panel">'+esc(e.message)+'</div>');
function selectRate(o){window.selectedOffer=o;const ssp=Number(o.suggestedSellingPrice),price=Number(o.retailRate),validSsp=Number.isFinite(ssp)&&ssp>price;document.getElementById('selection').innerHTML='<h3>'+esc(roomES(o.roomName||'Habitación'))+'</h3>'+(o.boardName?'<p>'+esc(o.boardName)+'</p>':'')+'<div class="priceBig">'+money(o.estimatedTotal??price)+'</div>'+(validSsp?'<div class="compare"><div class="compareRow"><span>Referencia pública</span><span class="strike">'+money(ssp)+'</span></div><div class="compareRow"><b>Valijeando</b><b>'+money(price)+'</b></div><div class="saving">Ahorrás '+money(ssp-price)+'</div></div>':'')+'<button class="bookBtn" id="bookBtn">Reconfirmar y continuar</button><div id="prebookBox" class="finalBox" hidden></div>';document.getElementById('bookBtn').onclick=()=>prebook(o);document.getElementById('booking').scrollIntoView({behavior:'smooth',block:'start'})}
async function prebook(o){const btn=document.getElementById('bookBtn'),box=document.getElementById('prebookBox');btn.disabled=true;btn.textContent='Reconfirmando…';box.hidden=true;try{const r=await fetch('/api/nuitee-prebook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offerId:o.offerId})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo reconfirmar');const finalPrice=d.price!=null?Number(d.price):null;box.hidden=false;box.innerHTML='<b>Precio reconfirmado</b><br><strong>'+(finalPrice!=null?money(finalPrice):'Disponible')+'</strong>'+(d.dueAtProperty>0?'<br>En el alojamiento: <b>'+money(d.dueAtProperty)+'</b>':'')+'<br><span class="small">Disponibilidad reconfirmada mediante Prebook.</span>';btn.textContent='Continuar con la reserva';btn.disabled=false;btn.onclick=()=>alert('Siguiente etapa: datos del huésped y pago SANDBOX. No se realizará ningún cobro todavía.')}catch(e){box.hidden=false;const unavailable=/availability|available/i.test(e.message);box.innerHTML='<span style="color:#9b1c1c">'+(unavailable?'Esta tarifa acaba de dejar de estar disponible. Elegí otra habitación o volvé a buscar.':esc(e.message))+'</span>';btn.textContent='Volver a intentar';btn.disabled=false}}
function open(i){idx=i;big.src=imgs[idx];modal.classList.add('open')} function step(n){if(!imgs.length)return;idx=(idx+n+imgs.length)%imgs.length;big.src=imgs[idx]}
document.querySelector('.close').onclick=()=>modal.classList.remove('open');document.querySelector('.prev').onclick=()=>step(-1);document.querySelector('.next').onclick=()=>step(1);modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
</script></body></html>
