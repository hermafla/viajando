<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hotel | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#07558f;padding:18px 24px}header img{width:210px}.wrap{width:min(1180px,94%);margin:24px auto}.back{color:#07558f;font-weight:800;text-decoration:none}.top{margin:18px 0}.top h1{margin:6px 0;font-size:30px}.muted{color:#64748b}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:210px 210px;gap:8px;border-radius:18px;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer}.gallery img:first-child{grid-row:1/3}.panel{background:#fff;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 8px 24px #0000000c}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#eef6fb;border-radius:999px;padding:8px 11px;font-size:13px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.room{border:1px solid #e3e9f1;border-radius:13px;padding:14px}.room img{width:100%;height:170px;object-fit:cover;border-radius:10px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}.modal.open{display:flex}.modal img{max-width:92vw;max-height:86vh}.close{position:absolute;right:25px;top:20px;color:#fff;font-size:35px;cursor:pointer}.nav{position:absolute;top:50%;color:#fff;font-size:45px;cursor:pointer;padding:20px}.prev{left:10px}.next{right:10px}@media(max-width:700px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:220px 120px}.gallery img:first-child{grid-column:1/3;grid-row:auto}.gallery img:nth-child(n+4){display:none}.rooms{grid-template-columns:1fr}.top h1{font-size:25px}}
</style></head><body><header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header><main class="wrap"><a class="back" href="/prueba-hoteles.html">← Volver a hoteles</a><div id="app"><p>Cargando hotel…</p></div></main><div class="modal" id="modal"><span class="close">×</span><span class="nav prev">‹</span><img id="big"><span class="nav next">›</span></div><script>
const id=new URLSearchParams(location.search).get('hotelId'),app=document.getElementById('app');let imgs=[],idx=0;
const strip=s=>{const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''};
fetch('/api/nuitee-hotel-detail?hotelId='+encodeURIComponent(id||'')).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error);return j}).then(({hotel:h})=>{
 imgs=h.images.map(x=>x.url);document.title=(h.name||'Hotel')+' | Valijeando';
 const gal=h.images.slice(0,5).map((x,i)=>'<img src="'+x.url+'" alt="'+(x.caption||h.name)+'" data-i="'+i+'">').join('');
 const fac=h.facilities.slice(0,30).map(x=>'<span class="chip">'+x+'</span>').join('');
 const rooms=h.rooms.slice(0,12).map(r=>'<div class="room">'+(r.photos[0]?'<img src="'+r.photos[0]+'" alt="'+r.roomName+'">':'')+'<h3>'+r.roomName+'</h3>'+(r.description?'<p>'+strip(r.description)+'</p>':'')+(r.maxOccupancy?'<p class="muted">Hasta '+r.maxOccupancy+' huéspedes</p>':'')+'</div>').join('');
 app.innerHTML='<section class="top"><span class="muted">SANDBOX</span><h1>'+h.name+'</h1><div>'+('★'.repeat(Math.min(Number(h.stars)||0,5)))+' · '+h.address+(h.city?' · '+h.city:'')+'</div></section>'+(gal?'<section class="gallery">'+gal+'</section>':'')+'<section class="panel"><h2>Sobre el hotel</h2><p>'+strip(h.description||'Información del alojamiento disponible al seleccionar una tarifa.')+'</p></section>'+(fac?'<section class="panel"><h2>Servicios</h2><div class="chips">'+fac+'</div></section>':'')+(rooms?'<section class="panel"><h2>Habitaciones</h2><div class="rooms">'+rooms+'</div></section>':'')+(h.importantInformation?'<section class="panel"><h2>Información importante</h2><p>'+strip(h.importantInformation)+'</p></section>':'');
 document.querySelectorAll('.gallery img').forEach(el=>el.onclick=()=>open(+el.dataset.i));
}).catch(e=>app.innerHTML='<div class="panel">'+e.message+'</div>');
const m=document.getElementById('modal'),big=document.getElementById('big');function open(i){idx=i;big.src=imgs[idx];m.classList.add('open')}function step(n){if(!imgs.length)return;idx=(idx+n+imgs.length)%imgs.length;big.src=imgs[idx]}.close.onclick=()=>m.classList.remove('open');document.querySelector('.prev').onclick=()=>step(-1);document.querySelector('.next').onclick=()=>step(1);m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
</script></body></html>
