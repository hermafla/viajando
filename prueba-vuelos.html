<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba White Label Widget | Valijeando</title>
  <link rel="icon" type="image/svg+xml" href="/valijeando-favicon.svg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    header{background:#07558f;padding:18px 24px}
    header img{width:210px;max-width:70vw;display:block}
    main{width:min(1180px,94%);margin:28px auto}
    .notice{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .notice h1{margin:0 0 6px;font-size:22px}
    .notice p{margin:0;line-height:1.5}
    #tpwl-search{margin-bottom:24px}
    #tpwl-tickets{min-height:200px}
  </style>
  <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
    (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.type = "module";
      script.src = "https://tpscr.com/wl_web/main.js?wl_id=22537";
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header>
  <main>
    <section class="notice">
      <h1>Prueba técnica de vuelos</h1>
      <p>Página temporal para probar el nuevo White Label Widget de Travelpayouts. No modifica el buscador actual de Valijeando.</p>
    </section>
    <div id="tpwl-search"></div>
    <div id="tpwl-tickets"></div>
    <section id="diag" style="margin-top:28px;background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.06)">
      <h2 style="margin:0 0 8px;font-size:18px">Diagnóstico técnico</h2>
      <p id="diag-status" style="margin:0 0 10px">Esperando resultados de Travelpayouts…</p>
      <pre id="diag-output" style="white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:12px;border-radius:10px;max-height:260px;overflow:auto"></pre>
    </section>

  </main>
  <script>
    (function(){
      const host=document.getElementById('tpwl-tickets');
      const status=document.getElementById('diag-status');
      const out=document.getElementById('diag-output');
      const messages=[];
      let timer;

      window.addEventListener('message',e=>{
        let data;
        try{ data=typeof e.data==='string'?e.data:JSON.stringify(e.data); }catch(_){ data='[no serializable]'; }
        messages.push({origin:e.origin,data:String(data).slice(0,500)});
        if(messages.length>20) messages.shift();
        inspect();
      });

      function shadowInfo(root=document){
        const found=[];
        const walk=node=>{
          if(!node || !node.querySelectorAll) return;
          node.querySelectorAll('*').forEach(el=>{
            if(el.shadowRoot){
              found.push({
                tag:el.tagName.toLowerCase(),
                id:el.id||'',
                className:typeof el.className==='string'?el.className:'',
                mode:'open',
                text:(el.shadowRoot.innerText||el.shadowRoot.textContent||'').trim().slice(0,1200)
              });
              walk(el.shadowRoot);
            }
          });
        };
        walk(root);
        return found.slice(0,20);
      }

      function inspect(){
        clearTimeout(timer);
        timer=setTimeout(()=>{
          const text=(host.innerText||host.textContent||'').trim();
          const frames=[...document.querySelectorAll('iframe')].map(f=>({
            src:f.src||'',
            title:f.title||'',
            id:f.id||'',
            name:f.name||'',
            parentId:f.parentElement&&f.parentElement.id||''
          })).slice(0,30);
          const shadows=shadowInfo();
          const hostHTML=host.innerHTML.slice(0,2500);
          const hostChildren=[...host.children].map(el=>({
            tag:el.tagName,
            id:el.id||'',
            className:typeof el.className==='string'?el.className:'',
            html:el.outerHTML.slice(0,800)
          })).slice(0,20);
          const summary={
            hostReadableText:text.slice(0,2000),
            hostHTML,
            hostChildren,
            iframes:frames,
            openShadowRoots:shadows,
            postMessages:messages
          };
          const clues=[];
          if(text) clues.push('texto DOM');
          if(frames.length) clues.push(frames.length+' iframe(s)');
          if(shadows.length) clues.push(shadows.length+' Shadow DOM abierto(s)');
          if(messages.length) clues.push(messages.length+' mensaje(s) postMessage');
          status.textContent=clues.length
            ? 'Detectado: '+clues.join(', ')+'.'
            : 'Sin acceso directo detectado: resultados visibles, pero encapsulados.';
          out.textContent=JSON.stringify(summary,null,2);
        },500);
      }

      new MutationObserver(inspect).observe(document.documentElement,{subtree:true,childList:true,attributes:true});
      setInterval(inspect,2500);
      inspect();
    })();
  </script>
</body>
</html>
