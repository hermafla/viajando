<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba White Label Widget | Valijeando</title>
  <link rel="icon" type="image/svg+xml" href="/valijeando-favicon.svg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    header{background:#07558f;padding:18px 24px}
    header img{width:210px;max-width:70vw;display:block}
    main{width:min(1180px,94%);margin:28px auto}
    .notice{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .notice h1{margin:0 0 6px;font-size:22px}
    .notice p{margin:0;line-height:1.5}
    #tpwl-search{margin-bottom:24px}
    #tpwl-tickets{min-height:200px}
  </style>
  <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
    (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.type = "module";
      script.src = "https://tpscr.com/wl_web/main.js?wl_id=22537";
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header>
  <main>
    <section class="notice">
      <h1>Prueba técnica de vuelos</h1>
      <p>Página temporal para probar el nuevo White Label Widget de Travelpayouts. No modifica el buscador actual de Valijeando.</p>
    </section>
    <div id="tpwl-search"></div>
    <div id="tpwl-tickets"></div>
    <section id="diag" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;width:min(430px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:#fff;border:2px solid #07558f;border-radius:14px;padding:14px 16px;box-shadow:0 12px 36px rgba(0,0,0,.28)">
      <h2 style="margin:0 0 8px;font-size:18px">Diagnóstico técnico · EN VIVO</h2>
      <p id="diag-status" style="margin:0 0 10px">Esperando resultados de Travelpayouts…</p>
      <pre id="diag-output" style="white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:12px;border-radius:10px;max-height:28vh;overflow:auto;font-size:11px"></pre>
    </section>

  </main>
  <script>
    (function(){
      const host=document.getElementById('tpwl-tickets');
      const status=document.getElementById('diag-status');
      const out=document.getElementById('diag-output');
      const messages=[];
      let timer;

      window.addEventListener('message',e=>{
        let data;
        try{ data=typeof e.data==='string'?e.data:JSON.stringify(e.data); }catch(_){ data='[no serializable]'; }
        messages.push({origin:e.origin,data:String(data).slice(0,500)});
        if(messages.length>20) messages.shift();
        inspect();
      });

      function collectRoots(root=document, acc=[]){
        acc.push(root);
        if(root.querySelectorAll){
          root.querySelectorAll('*').forEach(el=>{
            if(el.shadowRoot) collectRoots(el.shadowRoot,acc);
          });
        }
        return acc;
      }

      function inspect(){
        clearTimeout(timer);
        timer=setTimeout(()=>{
          const roots=collectRoots();
          const rootData=roots.map((root,i)=>{
            const text=(root.innerText||root.textContent||'').trim();
            const links=root.querySelectorAll ? [...root.querySelectorAll('a')].map(a=>({
              text:(a.innerText||a.textContent||'').trim(),
              href:a.href||''
            })).filter(x=>x.text||x.href).slice(0,40) : [];
            const buttons=root.querySelectorAll ? [...root.querySelectorAll('button')].map(b=>({
              text:(b.innerText||b.textContent||'').trim(),
              aria:b.getAttribute('aria-label')||'',
              title:b.getAttribute('title')||''
            })).filter(x=>x.text||x.aria||x.title).slice(0,40) : [];
            const prices=(text.match(/(?:USD|US\\$|ARS|\\$)\\s?[\\d][\\d. ]*(?:,[\\d]{1,2})?/g)||[]).slice(0,50);
            return {index:i,type:root===document?'document':'shadowRoot',textPreview:text.slice(0,5000),prices,links,buttons};
          });

          const allText=rootData.map(x=>x.textPreview).join('\n');
          const providerHits=['Gotogate','Mytrip','Flightnetwork','JetSmart','Comprar','Seleccione billete']
            .filter(x=>allText.toLowerCase().includes(x.toLowerCase()));
          const allPrices=[...new Set(rootData.flatMap(x=>x.prices))].slice(0,50);
          const buyButtons=rootData.flatMap(x=>x.buttons).filter(x=>/comprar|billete|buy|select/i.test(x.text+' '+x.aria+' '+x.title)).slice(0,30);
          const links=rootData.flatMap(x=>x.links).filter(x=>x.href).slice(0,50);

          status.textContent='Shadow DOM abiertos: '+(roots.length-1)+
            ' · Precios detectados: '+allPrices.length+
            ' · Coincidencias: '+(providerHits.join(', ')||'ninguna')+'.';
          out.textContent=JSON.stringify({
            prices:allPrices,
            providerHits,
            buyButtons,
            links,
            roots:rootData
          },null,2);
        },450);
      }

      new MutationObserver(inspect).observe(document.documentElement,{subtree:true,childList:true,attributes:true,characterData:true});
      setInterval(inspect,2000);
      inspect();
    })();
  </script>
</body>
</html>
