<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hoteles | Valijeando</title>
<link rel="icon" href="/valijeando-favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#10233f}header{height:76px;background:#fff;display:flex;align-items:center;position:sticky;top:0;z-index:40;border-bottom:1px solid #eef1f5}.nav{width:min(1160px,92%);margin:auto;display:flex;align-items:center;justify-content:space-between}.logo img{width:230px;display:block}.menu{display:flex;gap:28px;align-items:center}.menu a{text-decoration:none;color:#172b4d;font-weight:700;font-size:14px}.menu a.active{color:#1677ff}.account{border:1px solid #d0d5dd;border-radius:999px;padding:9px 14px!important}
main{width:min(1160px,92%);margin:24px auto 40px}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;color:#10233f;padding:15px 18px;border:1px solid #eef1f5;border-radius:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,35,63,.05)}
.hero h1{margin:0 0 3px;font-size:23px}.hero p{margin:0;color:#667085;line-height:1.4;font-size:13px}.hero .eyebrow{font-size:10px;color:#1677ff;font-weight:900;letter-spacing:1.4px;margin-bottom:4px}.sort-wrap{min-width:235px}.sort-wrap label{margin-bottom:5px}.sort-wrap select{width:100%;height:42px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;color:#172033;padding:0 10px;font-weight:700}.guest-edit{position:relative}.guest-field{width:100%;border:1px solid #dbe3ee;border-radius:10px;padding:12px;font-size:14px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;height:43px}.guest-pop{display:none;position:absolute;z-index:60;top:68px;right:0;width:350px;max-width:90vw;background:#fff;border:1px solid #d0d5dd;border-radius:14px;box-shadow:0 18px 45px rgba(16,35,63,.2);padding:15px}.guest-pop.open{display:block}.groom{padding:9px 0;border-bottom:1px solid #eef1f5}.groom:first-child{padding-top:0}.gtitle{font-weight:900;margin-bottom:8px}.grow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.gcounter{display:flex;align-items:center;gap:10px}.gcounter button{width:30px;height:30px;padding:0;border:1px solid #b8c3d1;background:#fff;color:#172033;border-radius:50%}.gcounter span{min-width:16px;text-align:center;font-weight:800}.gages{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.gages select{height:36px;border:1px solid #d0d5dd;border-radius:8px}.gactions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.gadd{background:transparent;color:#1677ff;padding:0}.gapply{height:38px;padding:8px 17px;background:#1677ff}.gremove{background:transparent;color:#b42318;padding:0;height:auto;font-size:12px}
.search{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr auto;gap:10px;background:#fff;padding:16px;border:1px solid #eef1f5;border-radius:16px;box-shadow:0 8px 24px rgba(16,35,63,.06);margin-bottom:18px}
label{font-size:12px;font-weight:800;color:#64748b;display:block;margin-bottom:6px}input{width:100%;border:1px solid #dbe3ee;border-radius:10px;padding:12px;font-size:15px}.destWrap{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid #dbe3ee;border-radius:10px;box-shadow:0 10px 25px #0002;overflow:hidden;margin-top:4px}.suggestion{padding:10px 12px;cursor:pointer}.suggestion:hover{background:#eef6fb}.suggestion small{display:block;color:#64748b;margin-top:2px}button{border:0;border-radius:999px;background:#f36b2b;color:#fff;font-weight:800;padding:12px 24px;cursor:pointer;align-self:end;height:43px}button:hover{background:#e96024}
.search-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 14px}.status{margin:0;color:#475569;font-weight:700}.guest-summary{font-size:13px;color:#64748b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.07);display:flex;flex-direction:column}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}.card img{width:100%;height:205px;object-fit:cover;background:#e9eef5}.body{padding:16px}.name{font-size:19px;font-weight:800;margin-bottom:6px}.meta{font-size:14px;color:#64748b;line-height:1.5}.rating{font-weight:800;color:#07558f}.price{margin-top:14px;border-top:1px solid #eef2f7;padding-top:13px}.price strong{font-size:24px}.small{font-size:12px;color:#64748b;margin-top:4px}.breakdown{margin-top:12px;padding:11px 12px;background:#f8fafc;border-radius:10px;font-size:13px;line-height:1.55}.breakdown b{color:#172033}.total{margin-top:7px;font-weight:800;color:#07558f}.detailBtn{display:block;text-align:center;text-decoration:none;background:#1677ff;color:#fff;border-radius:999px;font-weight:800;padding:11px;margin-top:12px}.detailBtn:hover{background:#0d68e8}.finalBtn{width:100%;margin-top:9px;height:auto;padding:11px}.finalBox{margin-top:10px;padding:12px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;font-size:13px;line-height:1.55}.finalBox strong{font-size:18px}.loading{opacity:.65;pointer-events:none}.badge{display:inline-block;background:#eaf4fb;color:#07558f;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:8px}.error{background:#fff0f0;color:#9b1c1c;padding:14px;border-radius:12px}
@media(max-width:900px){.menu{gap:14px}.hero{align-items:flex-start;flex-direction:column}.sort-wrap{width:100%;min-width:0}.search{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){header{height:68px}.logo img{width:185px}.menu a:not(.account){display:none}main{width:94%;margin-top:16px}.search,.grid{grid-template-columns:1fr}.hero{padding:16px 18px}.hero h1{font-size:22px}.search-summary{align-items:flex-start;flex-direction:column}.guest-summary{display:none}}
</style></head>
<body><header><div class="nav"><a class="logo" href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a><nav class="menu"><a class="active" href="/hoteles.html">Hoteles</a><a href="https://vuelos.valijeando.com.ar/">Vuelos</a><a href="/guias.html">Guías para viajar</a><a href="/consejos.html">Consejos</a><a class="account" href="/#buscar">Buscar</a></nav></div></header>
<main>
<section class="hero"><div><div class="eyebrow">ALOJAMIENTOS EN VALIJEANDO</div><h1>Encontrá tu alojamiento ideal</h1><p>Compará opciones disponibles para tus fechas y elegí la habitación que mejor se adapte a tu viaje.</p></div><div class="sort-wrap"><label for="sortHotels">Ordenar por</label><select id="sortHotels"><option value="priceAsc">Menor precio</option><option value="priceDesc">Mayor precio</option><option value="ratingDesc">Mejor valorados</option><option value="starsDesc">Más estrellas</option></select></div></section>
<form class="search" id="search">
<div class="destWrap"><label>Destino</label><input id="city" value="Rio de Janeiro" autocomplete="off" required><input id="placeId" type="hidden"><div class="suggestions" id="suggestions" hidden></div></div>
<div><label>Entrada</label><input id="checkin" type="date" value="2027-01-15" required></div>
<div><label>Salida</label><input id="checkout" type="date" value="2027-01-17" required></div>
<div class="guest-edit"><label>Huéspedes</label><input id="adults" type="hidden" value="2"><div id="guestField" class="guest-field">2 adultos · 1 habitación</div><div id="guestPop" class="guest-pop"><div id="guestRooms"></div><div class="gactions"><button type="button" class="gadd" id="gAddRoom">＋ Agregar habitación</button><button type="button" class="gapply" id="gApply">Aplicar</button></div></div></div>
<button type="submit">Buscar hoteles</button>
</form>
<div class="search-summary"><div class="status" id="status">Listo para buscar.</div><div class="guest-summary" id="guestSummary"></div></div><section class="grid" id="results"></section>
</main>
<script>
const form=document.getElementById('search'),status=document.getElementById('status'),results=document.getElementById('results'),suggestions=document.getElementById('suggestions'),placeId=document.getElementById('placeId');
let destTimer; city.addEventListener('input',()=>{placeId.value='';clearTimeout(destTimer);const q=city.value.trim();if(q.length<2){suggestions.hidden=true;return}destTimer=setTimeout(async()=>{try{const r=await fetch('/api/nuitee-places?q='+encodeURIComponent(q));const d=await r.json();const ps=d.places||[];suggestions.innerHTML=ps.map((p,i)=>'<div class="suggestion" data-i="'+i+'"><b>'+esc(p.displayName)+'</b><small>'+esc(p.formattedAddress)+'</small></div>').join('');suggestions._places=ps;suggestions.hidden=!ps.length}catch{suggestions.hidden=true}},250)});suggestions.addEventListener('click',e=>{const el=e.target.closest('.suggestion');if(!el)return;const p=suggestions._places[+el.dataset.i];city.value=p.displayName+(p.formattedAddress?' · '+p.formattedAddress:'');placeId.value=p.placeId;suggestions.hidden=true});document.addEventListener('click',e=>{if(!e.target.closest('.destWrap'))suggestions.hidden=true});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const incoming=new URLSearchParams(location.search);
if(incoming.get('city'))city.value=incoming.get('city');
if(incoming.get('placeId'))placeId.value=incoming.get('placeId');
if(incoming.get('checkin'))checkin.value=incoming.get('checkin');
if(incoming.get('checkout'))checkout.value=incoming.get('checkout');
if(incoming.get('adults'))adults.value=incoming.get('adults');
let incomingOccupancies=incoming.get('occupancies')||'';let occupancyData=[];try{occupancyData=JSON.parse(incomingOccupancies)||[]}catch{}if(!Array.isArray(occupancyData)||!occupancyData.length)occupancyData=[{adults:Number(incoming.get('adults')||2),children:Number(incoming.get('children')||0),childAges:[]}];
let incomingChildren=occupancyData.reduce((n,r)=>n+Number(r.children||0),0),incomingRooms=occupancyData.length;
const guestText=()=>{const a=occupancyData.reduce((n,r)=>n+Number(r.adults||0),0),ch=incomingChildren,rm=incomingRooms;return a+' adulto'+(a===1?'':'s')+(ch?' · '+ch+' niño'+(ch===1?'':'s'):'')+' · '+rm+' habitación'+(rm===1?'':'es')};
document.getElementById('guestSummary').textContent=guestText();document.getElementById('guestField').textContent=guestText();
function renderGuestEditor(){guestRooms.innerHTML=occupancyData.map((r,i)=>'<div class="groom"><div class="gtitle">Habitación '+(i+1)+'</div><div class="grow"><span>Adultos</span><div class="gcounter"><button type="button" data-a="adultMinus" data-i="'+i+'">−</button><span>'+r.adults+'</span><button type="button" data-a="adultPlus" data-i="'+i+'">+</button></div></div><div class="grow"><span>Niños <small style="color:#667085">(0 a 17 años)</small></span><div class="gcounter"><button type="button" data-a="childMinus" data-i="'+i+'">−</button><span>'+r.children+'</span><button type="button" data-a="childPlus" data-i="'+i+'">+</button></div></div>'+(r.children?'<div class="gages">'+Array.from({length:r.children},(_,j)=>'<label>Edad '+(j+1)+'<select data-age="'+j+'" data-i="'+i+'">'+Array.from({length:18},(_,a)=>'<option value="'+a+'" '+((r.childAges||[])[j]==a?'selected':'')+'>'+a+' años</option>').join('')+'</select></label>').join('')+'</div>':'')+(occupancyData.length>1?'<button type="button" class="gremove" data-a="remove" data-i="'+i+'">Eliminar habitación</button>':'')+'</div>').join('')}
guestField.onclick=e=>{e.stopPropagation();guestPop.classList.toggle('open');renderGuestEditor()};
guestPop.onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,r=occupancyData[i],a=b.dataset.a;if(a==='adultMinus'&&r.adults>1)r.adults--;if(a==='adultPlus'&&r.adults<10)r.adults++;if(a==='childMinus'&&r.children>0){r.children--;r.childAges=(r.childAges||[]).slice(0,r.children)}if(a==='childPlus'&&r.children<6){r.children++;r.childAges=r.childAges||[];while(r.childAges.length<r.children)r.childAges.push(0)}if(a==='remove'&&occupancyData.length>1)occupancyData.splice(i,1);renderGuestEditor()};
guestPop.onchange=e=>{if(e.target.matches('[data-age]')){const i=+e.target.dataset.i,j=+e.target.dataset.age;occupancyData[i].childAges=occupancyData[i].childAges||[];occupancyData[i].childAges[j]=+e.target.value}};
gAddRoom.onclick=()=>{if(occupancyData.length<5){occupancyData.push({adults:2,children:0,childAges:[]});renderGuestEditor()}};
gApply.onclick=()=>{incomingRooms=occupancyData.length;incomingChildren=occupancyData.reduce((n,r)=>n+Number(r.children||0),0);adults.value=occupancyData.reduce((n,r)=>n+Number(r.adults||0),0);incomingOccupancies=JSON.stringify(occupancyData);guestField.textContent=guestText();guestSummary.textContent=guestText();guestPop.classList.remove('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.guest-edit'))guestPop.classList.remove('open')});
const autoSearch=placeId.value&&checkin.value&&checkout.value;
form.addEventListener('submit',async e=>{e.preventDefault();results.innerHTML='';status.textContent='Buscando disponibilidad y precios…';
if(!placeId.value){status.textContent='Elegí un destino de la lista para buscar hoteles.';city.focus();return} const q=new URLSearchParams({city:city.value,placeId:placeId.value,checkin:checkin.value,checkout:checkout.value,adults:adults.value,currency:'USD',guestNationality:'AR'});if(incomingOccupancies)q.set('occupancies',incomingOccupancies);
try{const r=await fetch('/api/nuitee-hotels?'+q);const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo consultar Nuitee');
status.textContent=data.hotels.length?data.hotels.length+' alojamientos disponibles':'No encontramos alojamientos con tarifa para esas fechas.';document.getElementById('guestSummary').textContent=guestText();document.getElementById('guestField').textContent=guestText();
window._hotels=data.hotels;renderHotelResults(data.hotels);
function renderHotelResults(list){results.innerHTML=list.map(h=>{sessionStorage.setItem('hotelOffers:'+h.hotelId,JSON.stringify(h.offers||[]));const qp=new URLSearchParams({hotelId:h.hotelId,checkin:checkin.value,checkout:checkout.value,adults:adults.value,children:incomingChildren,rooms:incomingRooms});if(incomingOccupancies)qp.set('occupancies',incomingOccupancies);const url='/hotel.html?'+qp;return `<article class="card" data-url="${url}" tabindex="0"><img src="${h.photo||''}" alt="${h.name}" loading="lazy"><div class="body"><div class="name">${h.name}</div><div class="meta">${h.stars?'★ '.repeat(Math.min(h.stars,5)):''}<span class="rating">${h.rating?h.rating+'/10':''}</span>${h.reviewCount?' · '+Number(h.reviewCount).toLocaleString('es-AR')+' reseñas':''}<br>${h.address||''}</div><div class="price"><span>Precio de la estadía</span><br><strong>${money(h.retailRate)}</strong><div class="small">${checkin.value} → ${checkout.value} · ${guestText()}</div>${h.dueAtProperty>0?`<div class="breakdown"><div>Pagás para reservar: <b>${money(h.retailRate)}</b></div><div>Pagás en el alojamiento: <b>${money(h.dueAtProperty)}</b></div><div class="total">Total estimado: ${money(h.estimatedTotal)}</div></div>`:''}<a class="detailBtn" href="${url}">Ver hotel, habitaciones y precio</a></div></div></article>`}).join('');}
}catch(err){status.innerHTML='<div class="error">'+err.message+'</div>';}});

if(autoSearch)form.requestSubmit();
results.addEventListener('click',e=>{const card=e.target.closest('.card');if(card&&!e.target.closest('button,a'))location.href=card.dataset.url});
results.addEventListener('keydown',e=>{const card=e.target.closest('.card');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();location.href=card.dataset.url}});

results.addEventListener('click',async e=>{
 const btn=e.target.closest('.finalBtn'); if(!btn)return;
 const box=btn.nextElementSibling,offerId=btn.dataset.offer;
 if(!offerId){box.hidden=false;box.textContent='Esta tarifa no se puede reconfirmar. Volvé a buscar.';return}
 btn.classList.add('loading');btn.textContent='Reconfirmando…';box.hidden=true;
 try{
  const r=await fetch('/api/nuitee-prebook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offerId})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'No se pudo reconfirmar');
  box.hidden=false;
  const p=d.price!=null?money(d.price):'Precio confirmado por Nuitee';
  box.innerHTML='<b>Precio reconfirmado</b><br><strong>'+p+'</strong>'+(d.dueAtProperty>0?'<br>Pagás en el alojamiento: <b>'+money(d.dueAtProperty)+'</b><br>Total estimado: <b>'+money(d.estimatedTotal)+'</b>':'<br><span class="small">No se informaron cargos separados en esta reconfirmación.</span>')+'<br><span class="small">Disponibilidad y precio reconfirmados antes de reservar.</span>';
 }catch(err){box.hidden=false;box.innerHTML='<span style="color:#9b1c1c">'+err.message+'</span>'}
 finally{btn.classList.remove('loading');btn.textContent='Volver a reconfirmar'}
});

document.getElementById('sortHotels').addEventListener('change',e=>{const list=[...(window._hotels||[])];const v=e.target.value;if(v==='priceAsc')list.sort((a,b)=>(a.estimatedTotal??a.retailRate)-(b.estimatedTotal??b.retailRate));if(v==='priceDesc')list.sort((a,b)=>(b.estimatedTotal??b.retailRate)-(a.estimatedTotal??a.retailRate));if(v==='ratingDesc')list.sort((a,b)=>(b.rating||0)-(a.rating||0));if(v==='starsDesc')list.sort((a,b)=>(b.stars||0)-(a.stars||0));renderHotelResults(list)});
</script></body></html>
