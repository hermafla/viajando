<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reserva de prueba | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#07558f;padding:18px 24px}header img{width:210px}.wrap{width:min(1100px,94%);margin:28px auto}.sandbox{display:inline-block;background:#fff3cd;color:#725500;padding:7px 10px;border-radius:8px;font-weight:800;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 24px #0000000c;margin-top:18px}.formTitle{margin:0 0 4px}.intro{margin:0 0 18px;color:#64748b}.secure{display:flex;gap:8px;align-items:center;background:#eef8f2;color:#176b37;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}label{font-weight:800;display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}input:focus{outline:2px solid #b9ddf5;border-color:#07558f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:11px;background:#f58220;color:#fff;font-weight:900;padding:14px;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.muted{color:#64748b}.summary{position:sticky;top:18px}.summary h2{margin-top:0}.summaryHotel{font-size:18px;font-weight:900}.summaryDates{background:#f7fafc;border-radius:10px;padding:10px 12px;margin:12px 0}.summaryRoom{border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:12px 0;margin:12px 0}.price{font-size:30px;font-weight:900;margin-top:5px}.priceLabel{font-size:13px;color:#64748b}.paySplit{font-size:13px;line-height:1.45}.detailRows{margin:10px 0}.detailRow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:13px}.detailRow span:first-child{color:#64748b}.detailRow b{text-align:right}.billing{margin-top:16px;padding:12px;background:#f7fafc;border:1px solid #e5edf5;border-radius:10px;font-size:12px;line-height:1.4}.billing b{display:block;font-size:13px;margin-bottom:4px}.cancelSummary{font-size:13px;margin:10px 0}.cancelSummary.good{color:#08752a}.cancelSummary.bad{color:#b91c1c}.ok{background:#eaf8ef;padding:16px;border-radius:10px;margin-top:14px}.err{background:#fff0f0;color:#9b1c1c;padding:14px;border-radius:10px;margin-top:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.summary{position:static;order:-1}}</style></head><body><header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header><main class="wrap"><span class="sandbox">SANDBOX · no se realizará ningún cobro real</span><h1>Finalizá tu reserva</h1><div class="layout"><section class="card"><h2 class="formTitle">Datos del huésped</h2><p class="intro">Ingresá los datos de la persona responsable de la reserva.</p><div class="secure">✓ Tu habitación y tarifa fueron reconfirmadas antes de llegar a este paso.</div><form id="form"><div class="row"><div><label>Nombre</label><input id="firstName" required autocomplete="given-name"></div><div><label>Apellido</label><input id="lastName" required autocomplete="family-name"></div></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Teléfono <span class="muted">(opcional)</span></label><input id="phone" type="tel" autocomplete="tel"><button class="btn" id="submit">Confirmar reserva</button></form><div id="result"></div></section><aside class="card" id="summary"></aside></div></main><script>
const data=JSON.parse(sessionStorage.getItem('valijeandoCheckout')||'null'),summary=document.getElementById('summary'),result=document.getElementById('result'),money=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
if(!data){summary.innerHTML='<b>No encontramos una reserva preparada.</b><p>Volvé al hotel y elegí una habitación.</p>';document.getElementById('submit').disabled=true}else{
 const cp=data.cancellationPolicies||{},tag=String(cp.refundableTag||data.refundableTag||'').toUpperCase(),infos=Array.isArray(cp.cancelPolicyInfos)?cp.cancelPolicyInfos:[],first=infos.filter(x=>x&&x.cancelTime).sort((a,b)=>String(a.cancelTime).localeCompare(String(b.cancelTime)))[0];
 const cancel=tag==='RFN'?'<div class="cancelSummary good">✓ Tarifa reembolsable'+(first?' · cancelación según condiciones hasta '+esc(formatDateTime(first.cancelTime)):' según las condiciones seleccionadas')+'.</div>':tag?'<div class="cancelSummary bad">✕ Tarifa no reembolsable.</div>':'';
 const nights=nightCount(data.checkin,data.checkout),fees=Array.isArray(data.fees)?data.fees:[],included=fees.filter(x=>x&&x.included),due=Number(data.dueAtProperty||0),total=Number(data.estimatedTotal??data.price);
 summary.classList.add('summary');
 summary.innerHTML='<h2>Resumen de tu reserva</h2><div class="summaryHotel">'+esc(data.hotelName||'Hotel')+'</div><div class="summaryDates"><b>'+esc(formatDate(data.checkin))+' → '+esc(formatDate(data.checkout))+'</b><br><span class="muted">'+(nights?esc(nights)+' noche'+(nights===1?'':'s')+' · ':'')+esc(data.adults)+' adulto(s)</span></div><div class="summaryRoom"><b>'+esc(roomES(data.roomName||'Habitación'))+'</b>'+(data.boardName?'<div class="muted" style="margin-top:5px">'+esc(data.boardName)+'</div>':'')+cancel+'</div><div class="detailRows">'+(included.length?'<div class="detailRow"><span>Impuestos y cargos informados</span><b>Incluidos</b></div>':'')+(due>0?'<div class="detailRow"><span>A pagar en el alojamiento</span><b>'+money(due)+'</b></div>':'<div class="detailRow"><span>Cargos informados en el alojamiento</span><b>No se informan cargos adicionales</b></div>')+'</div><div class="priceLabel">Total de la reserva</div><div class="price">'+money(total)+'</div>'+(due>0?'<p class="paySplit"><b>'+money(data.price)+'</b> en Valijeando<br><b>'+money(due)+'</b> en el alojamiento</p>':'<p class="paySplit">Importe informado para pagar en Valijeando.</p>')+'<div class="billing"><b>Comprobante y facturación</b>Al confirmar la reserva recibirás los datos de confirmación. La modalidad definitiva de facturación y cobro se informará antes del lanzamiento comercial.</div>'
}
function formatDate(s){if(!s)return '';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function formatDateTime(s){if(!s)return '';const d=new Date(String(s).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?s:d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' GMT'}
function nightCount(a,b){const x=new Date(a+'T00:00:00Z'),y=new Date(b+'T00:00:00Z'),n=Math.round((y-x)/86400000);return Number.isFinite(n)&&n>0?n:0}
function roomES(s){s=String(s||'Habitación');const rules=[[/Double Room Superior with Mountain View/ig,'Habitación Doble Superior con Vista a la Montaña'],[/Standard Double Room with One Bunk Bed/ig,'Habitación Doble Estándar con Cucheta'],[/Standard Apartment with 1 Double Bed and 1 Extra Bed/ig,'Apartamento Estándar con 1 cama doble y 1 cama adicional'],[/Twin Room Superior/ig,'Habitación Superior con dos camas'],[/Double room King bed - Superior/ig,'Habitación Superior con cama King'],[/TRIPLE SUPERIOR NON SMOKING/ig,'Habitación Triple Superior para no fumadores'],[/Superior King Room/ig,'Habitación Superior con cama King'],[/Superior Twin Room/ig,'Habitación Superior con dos camas']];for(const [a,b] of rules)s=s.replace(a,b);return s}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!data)return;const b=document.getElementById('submit');b.disabled=true;b.textContent='Confirmando reserva…';result.innerHTML='';try{const r=await fetch('/api/nuitee-book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prebookId:data.prebookId,firstName:firstName.value,lastName:lastName.value,email:email.value,phone:phone.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo confirmar');result.innerHTML='<div class="ok"><h2>Reserva SANDBOX confirmada</h2><p>Booking ID: <b>'+esc(d.bookingId||'Confirmado')+'</b></p>'+(d.hotelConfirmationCode?'<p>Confirmación del hotel: <b>'+esc(d.hotelConfirmationCode)+'</b></p>':'')+'<p>No se realizó ningún cobro real.</p></div>';b.textContent='Reserva confirmada'}catch(err){result.innerHTML='<div class="err">'+esc(err.message)+'</div>';b.disabled=false;b.textContent='Volver a intentar'}};</script></body></html>
