<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reserva de prueba | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#07558f;padding:18px 24px}header img{width:210px}.wrap{width:min(1050px,94%);margin:28px auto}.sandbox{display:inline-block;background:#fff3cd;padding:7px 10px;border-radius:8px;font-weight:800}.layout{display:grid;grid-template-columns:1fr 360px;gap:22px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px #0000000c;margin-top:18px}label{font-weight:800;display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:11px;background:#f58220;color:#fff;font-weight:900;padding:14px;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.55}.muted{color:#64748b}.price{font-size:28px;font-weight:900}.ok{background:#eaf8ef;padding:14px;border-radius:10px;margin-top:14px}.err{background:#fff0f0;color:#9b1c1c;padding:14px;border-radius:10px;margin-top:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a></header><main class="wrap"><span class="sandbox">SANDBOX · no se realizará ningún cobro real</span><h1>Completá los datos del huésped</h1><div class="layout"><section class="card"><form id="form"><div class="row"><div><label>Nombre</label><input id="firstName" required autocomplete="given-name"></div><div><label>Apellido</label><input id="lastName" required autocomplete="family-name"></div></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Teléfono <span class="muted">(opcional)</span></label><input id="phone" type="tel" autocomplete="tel"><button class="btn" id="submit">Confirmar reserva de prueba</button></form><div id="result"></div></section><aside class="card" id="summary"></aside></div></main><script>
const data=JSON.parse(sessionStorage.getItem('valijeandoCheckout')||'null'),summary=document.getElementById('summary'),result=document.getElementById('result'),money=n=>'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
if(!data){summary.innerHTML='<b>No encontramos una reserva preparada.</b><p>Volvé al hotel y elegí una habitación.</p>';document.getElementById('submit').disabled=true}else{summary.innerHTML='<h2>Tu reserva</h2><b>'+esc(data.hotelName||'Hotel')+'</b><p>'+esc(data.checkin)+' → '+esc(data.checkout)+' · '+esc(data.adults)+' adulto(s)</p><p><b>'+esc(data.roomName||'Habitación')+'</b></p>'+(data.boardName?'<p>'+esc(data.boardName)+'</p>':'')+'<div class="price">'+money(data.estimatedTotal??data.price)+'</div>'+(Number(data.dueAtProperty)>0?'<p>'+money(data.price)+' en Valijeando<br>'+money(data.dueAtProperty)+' en el alojamiento</p>':'<p>Se paga en Valijeando</p>')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!data)return;const b=document.getElementById('submit');b.disabled=true;b.textContent='Confirmando con Nuitee…';result.innerHTML='';try{const r=await fetch('/api/nuitee-book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prebookId:data.prebookId,firstName:firstName.value,lastName:lastName.value,email:email.value,phone:phone.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo confirmar');result.innerHTML='<div class="ok"><h2>Reserva SANDBOX confirmada</h2><p>Booking ID: <b>'+esc(d.bookingId||'Confirmado')+'</b></p>'+(d.hotelConfirmationCode?'<p>Confirmación del hotel: <b>'+esc(d.hotelConfirmationCode)+'</b></p>':'')+'<p>No se realizó ningún cobro real.</p></div>';b.textContent='Reserva confirmada'}catch(err){result.innerHTML='<div class="err">'+esc(err.message)+'</div>';b.disabled=false;b.textContent='Volver a intentar'}};</script></body></html>
