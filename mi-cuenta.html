<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta | Valijeando</title><link rel="icon" href="/valijeando-favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:#172033}header{height:76px;background:#fff;border-bottom:1px solid #e8edf4;display:flex;align-items:center}.nav{width:min(1050px,92%);margin:auto;display:flex;align-items:center;justify-content:space-between}.nav img{width:220px}.back{color:#1677ff;text-decoration:none;font-weight:800}.wrap{width:min(900px,92%);margin:46px auto}.card{background:#fff;border:1px solid #e1e7ef;border-radius:20px;padding:28px;box-shadow:0 12px 34px rgba(16,35,63,.08)}h1{margin:0 0 8px;font-size:32px}.sub{color:#667085;margin:0 0 24px;line-height:1.5}.form{display:flex;gap:10px}.form input{flex:1;height:48px;border:1px solid #cfd7e3;border-radius:10px;padding:0 13px;font-size:16px}.btn{height:48px;border:0;border-radius:999px;background:#1677ff;color:#fff;font-weight:800;padding:0 24px;cursor:pointer}.msg{margin-top:14px;font-size:14px}.muted{color:#667085}.hidden{display:none}.code{max-width:230px;letter-spacing:7px;text-align:center;font-weight:800;font-size:22px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.logout{border:0;background:none;color:#1677ff;font-weight:800;cursor:pointer}.reservas{display:grid;gap:18px}.reserva{background:#fff;border:1px solid #dfe6ef;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(16,35,63,.05)}.reserva-main{display:grid;grid-template-columns:150px 1fr;min-height:150px}.hotel-photo{width:100%;height:100%;min-height:150px;object-fit:cover;background:linear-gradient(135deg,#e9f2ff,#fff3e8)}.reserva-body{padding:20px}.reserva h3{margin:7px 0 8px;font-size:22px}.badge{display:inline-block;background:#eaf7ef;color:#16733a;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;margin-top:16px}.label{font-size:12px;color:#667085}.value{font-weight:700;margin-top:2px}.codebox{margin-top:15px;background:#f5f8fc;border-radius:10px;padding:11px 13px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid #edf1f6}.details{border:0;background:none;color:#1677ff;font-weight:800;cursor:pointer;padding:7px 0}.cancel{border:0;background:none;color:#667085;font-weight:700;cursor:pointer;padding:7px}.panel{margin-top:14px;border:1px solid #e4eaf2;border-radius:12px;padding:15px;background:#fbfcfe}.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ok{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eaf7ef;color:#16733a;font-weight:900}.manage{margin-top:14px;padding:14px;border-radius:12px;background:#f3f7fd}.manage-title{font-weight:800;margin-bottom:7px}.warning{font-size:13px;line-height:1.45;color:#475467;margin:8px 0 0}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:650px){.form{display:grid}.grid{grid-template-columns:1fr}.card{padding:20px}.nav img{width:185px}.reserva-main{grid-template-columns:1fr}.hotel-photo{height:180px}.actions{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="nav"><a href="/"><img src="/valijeando-logo.svg" alt="Valijeando"></a><a class="back" href="/">← Volver</a></div></header>
<main class="wrap">
<section class="card" id="login"><h1>Mi cuenta</h1><p class="sub">Ingresá con el mismo email que usaste en tu reserva. Te enviaremos un código de 6 dígitos; no necesitás contraseña.</p>
<div id="stepEmail"><div class="form"><input id="email" type="email" autocomplete="email" placeholder="tu@email.com"><button class="btn" id="send">Enviar código</button></div></div>
<div id="stepCode" class="hidden"><p class="muted">Enviamos un código a <strong id="shownEmail"></strong>.</p><div class="form"><input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button class="btn" id="verify">Ingresar</button></div><p><button class="logout" id="again">Usar otro email</button></p></div>
<div class="msg" id="msg"></div></section>
<section id="account" class="hidden"><div class="head"><div><h1>Mis reservas</h1><div class="muted" id="accountEmail"></div></div><button class="logout" id="logout">Cerrar sesión</button></div><div class="reservas" id="reservas"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentEmail='';
function message(t,bad=false){$('msg').textContent=t;$('msg').style.color=bad?'#b42318':'#475467'}
function date(v){if(!v)return '—';return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T00:00:00Z'))}
function money(r){const ars=Number(r.total_ars),usd=Number(r.total_usd);if(Number.isFinite(ars)&&ars>0)return 'ARS '+ars.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});if(Number.isFinite(usd)&&usd>0)return 'USD '+usd.toFixed(2);return '—'}
function fallbackPhoto(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#fff0df"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="47%" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1677ff">Valijeando</text><text x="50%" y="59%" text-anchor="middle" font-family="Arial" font-size="15" fill="#667085">Tu próximo viaje, más cerca</text></svg>')}
function policy(r){if(r.reembolsable===false)return 'Esta tarifa figura como no reembolsable. Antes de cualquier cancelación te mostraremos las condiciones aplicables.';if(r.reembolsable===true)return 'Esta reserva figura como reembolsable. La fecha límite y cualquier cargo deben confirmarse antes de cancelar.';return 'Antes de cancelar verificaremos las condiciones y cualquier cargo aplicable a esta reserva.'}
function toggleDetails(id){const e=document.getElementById(id);if(e)e.classList.toggle('hidden')}
function cancelInfo(id){const e=document.getElementById(id);if(e)e.classList.toggle('hidden')}
async function loadPhoto(img,hotelId){if(!img||!hotelId)return;try{const r=await fetch('/api/nuitee-hotel-detail?hotelId='+encodeURIComponent(hotelId));if(!r.ok)return;const j=await r.json();const photo=j?.hotel?.images?.[0]?.url;if(photo){img.src=photo;img.alt=j?.hotel?.name?'Foto de '+j.hotel.name:'Foto del hotel'}}catch{}}
async function send(){currentEmail=$('email').value.trim().toLowerCase();if(!currentEmail)return message('Ingresá tu email.',true);$('send').disabled=true;message('Enviando código…');try{const r=await fetch('/api/account-request-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail})});const j=await r.json();if(!r.ok)throw Error(j.error||'No pudimos enviar el código.');$('shownEmail').textContent=currentEmail;$('stepEmail').classList.add('hidden');$('stepCode').classList.remove('hidden');message(j.message||'Revisá tu correo.')}catch(e){message(e.message,true)}finally{$('send').disabled=false}}
async function verify(){const code=$('code').value.replace(/\D/g,'');if(code.length!==6)return message('Ingresá los 6 dígitos.',true);$('verify').disabled=true;message('Validando…');try{const r=await fetch('/api/account-verify-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail,code})});const j=await r.json();if(!r.ok)throw Error(j.error||'Código incorrecto.');sessionStorage.setItem('valijeandoAccountToken',j.token);await load(j.token)}catch(e){message(e.message,true)}finally{$('verify').disabled=false}}
async function load(token=sessionStorage.getItem('valijeandoAccountToken')){if(!token)return;const r=await fetch('/api/account-request-code',{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok){sessionStorage.removeItem('valijeandoAccountToken');return message(j.error||'Volvé a ingresar.',true)}$('login').classList.add('hidden');$('account').classList.remove('hidden');$('accountEmail').textContent=j.email;const rows=j.reservations||[];$('reservas').innerHTML=rows.length?rows.map((x,i)=>{const detail='detail-'+i,cancel='cancel-'+i;return '<article class="reserva"><div class="reserva-main"><img class="hotel-photo" data-hotel-id="'+esc(x.hotel_id||'')+'" src="'+fallbackPhoto()+'" alt=""><div class="reserva-body"><div class="badge">'+esc(x.estado||'Reserva')+'</div><h3>'+esc(x.hotel_nombre||'Alojamiento')+'</h3><div class="grid"><div><div class="label">Entrada</div><div class="value">'+date(x.checkin)+'</div></div><div><div class="label">Salida</div><div class="value">'+date(x.checkout)+'</div></div><div><div class="label">Habitación</div><div class="value">'+esc(x.habitacion_nombre||'—')+'</div></div><div><div class="label">Régimen</div><div class="value">'+esc(x.regimen||'—')+'</div></div><div><div class="label">Pasajeros</div><div class="value">'+esc(x.adultos||0)+' adulto(s)'+(x.ninos?' · '+esc(x.ninos)+' niño(s)':'')+'</div></div><div><div class="label">Importe registrado</div><div class="value">'+money(x)+'</div></div></div><div class="actions"><button class="details" onclick="toggleDetails(\''+detail+'\')">Ver reserva →</button></div><div id="'+detail+'" class="panel hidden"><div class="detail-head"><span class="ok">✓</span><div><strong>Tu estancia está confirmada</strong><div class="label">Guardá estos datos para tu viaje.</div></div></div><div class="grid"><div><div class="label">Entrada</div><div class="value">'+date(x.checkin)+'</div></div><div><div class="label">Salida</div><div class="value">'+date(x.checkout)+'</div></div><div><div class="label">Código de reserva</div><div class="value">'+esc(x.booking_id||'—')+'</div></div>'+(x.confirmacion_hotel&&String(x.confirmacion_hotel).toLowerCase()!=='test'?'<div><div class="label">Confirmación del hotel</div><div class="value">'+esc(x.confirmacion_hotel)+'</div></div>':'')+'</div><div class="manage"><div class="manage-title">Gestión de la reserva</div><div class="warning">'+esc(policy(x))+'</div></div></div><div id="'+cancel+'" class="panel hidden"><strong>Cancelar reserva</strong><p class="warning">'+esc(policy(x))+'</p><p class="warning"><strong>Por seguridad, la cancelación todavía no se ejecuta desde este botón.</strong> Primero vamos a conectar y probar la cancelación con el proveedor.</p></div></div></div></article>'}).join(''):'<div class="card empty">Todavía no encontramos reservas asociadas a esta cuenta.</div>';document.querySelectorAll('.hotel-photo[data-hotel-id]').forEach(img=>loadPhoto(img,img.dataset.hotelId))}
$('send').onclick=send;$('verify').onclick=verify;$('email').onkeydown=e=>{if(e.key==='Enter')send()};$('code').onkeydown=e=>{if(e.key==='Enter')verify()};$('again').onclick=()=>{$('stepCode').classList.add('hidden');$('stepEmail').classList.remove('hidden');message('')};$('logout').onclick=()=>{sessionStorage.removeItem('valijeandoAccountToken');location.reload()};load();
</script></body></html>
